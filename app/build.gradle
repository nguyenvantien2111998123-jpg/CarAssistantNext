plugins {
    id 'com.android.application'
}

android {
    namespace 'com.carassistant.next'
    compileSdk 35

    defaultConfig {
        applicationId 'com.carassistant.next'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '1.0.0-core-v1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
