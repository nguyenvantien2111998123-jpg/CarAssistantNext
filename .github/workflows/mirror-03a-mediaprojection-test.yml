name: MIRROR-03A - MediaProjection Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-03a-mediaprojection-test
  cancel-in-progress: false

jobs:
  build-mirror-03a:
    name: Build MediaProjection test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Cai JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cai Android SDK
        uses: android-actions/setup-android@v4

      - name: Cai Android platform va build tools
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Cai Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bao ve core GD01
        run: |
          set -euo pipefail
          check_sha() {
            local actual
            actual="$(git hash-object "$1")"
            echo "$1: $actual"
            test "$actual" = "$2" || {
              echo "::error::Core GD01 thay doi: $1"
              exit 1
            }
          }
          check_sha "app/src/main/java/com/carassistant/next/HookEntry.java" "667e759417611d6982bb110ef0583f9513db2c63"
          check_sha "app/src/main/AndroidManifest.xml" "b23d082324e633bde63f0997e4c90b320f9b69df"
          check_sha "app/build.gradle" "7be503b5df091734ea6babd3b0108e220272207b"
          echo "CORE GD01: PASS"

      - name: Tao project MIRROR-03A
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mirror03a/app/src/main/java/com/carassistant/next/mirror03a
          mkdir -p mirror03a/app/src/main/res/values

          cat > mirror03a/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Mirror03ACapture"
          include(":app")
          EOF

          cat > mirror03a/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > mirror03a/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > mirror03a/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.carassistant.next.mirror03a'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.carassistant.next.mirror03a'
                  minSdk 29
                  targetSdk 32
                  versionCode 3
                  versionName '1.0.3-mirror03a'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > mirror03a/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">MIRROR-03A Capture Test</string>
          </resources>
          EOF

          cat > mirror03a/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".Mirror03AActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > mirror03a/app/src/main/java/com/carassistant/next/mirror03a/Mirror03AActivity.java <<'EOF'
          package com.carassistant.next.mirror03a;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public final class Mirror03AActivity extends Activity {
              private static final String TAG = "MIRROR03A";
              private static final int REQUEST_CAPTURE = 301;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private TextView status;
              private MediaProjection projection;
              private VirtualDisplay virtualDisplay;
              private ImageReader imageReader;
              private int frameCount = 0;
              private boolean stopping = false;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24, 24, 24, 24);

                  TextView title = new TextView(this);
                  title.setText("MIRROR-03A\nMediaProjection Capture Test");
                  title.setTextSize(22);
                  root.addView(title);

                  status = new TextView(this);
                  status.setTextSize(16);
                  status.setText("READY — Chua cap quyen chup man hinh");
                  LinearLayout.LayoutParams statusParams = new LinearLayout.LayoutParams(-1, 0, 1);
                  statusParams.topMargin = 24;
                  root.addView(status, statusParams);

                  Button start = new Button(this);
                  start.setText("1. Bat dau thu chup man hinh");
                  start.setOnClickListener(v -> requestCapture());
                  root.addView(start);

                  Button stop = new Button(this);
                  stop.setText("2. Dung chup man hinh");
                  stop.setOnClickListener(v -> stopCapture());
                  root.addView(stop);

                  setContentView(root);
                  Log.i(TAG, "ACTIVITY_READY package=" + getPackageName());
              }

              private void requestCapture() {
                  if (projection != null) {
                      setStatus("CAPTURE DANG CHAY");
                      return;
                  }
                  try {
                      MediaProjectionManager manager = (MediaProjectionManager) getSystemService(
                              Context.MEDIA_PROJECTION_SERVICE);
                      Log.i(TAG, "REQUESTING_MEDIA_PROJECTION");
                      startActivityForResult(
                              manager.createScreenCaptureIntent(), REQUEST_CAPTURE);
                  } catch (Throwable e) {
                      Log.e(TAG, "CAPTURE_REQUEST_FAILED", e);
                      setStatus("CAPTURE_REQUEST_FAILED: " + e);
                  }
              }

              @Override
              protected void onActivityResult(
                      int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != REQUEST_CAPTURE) return;
                  if (resultCode != RESULT_OK || data == null) {
                      Log.w(TAG, "DA TU CHOI HOAC HUY QUYEN");
                      setStatus("DA TU CHOI HOAC HUY QUYEN");
                      return;
                  }
                  startCapture(resultCode, data);
              }

              private void startCapture(int resultCode, Intent data) {
                  try {
                      WindowManager wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                      android.util.DisplayMetrics metrics = new android.util.DisplayMetrics();
                      wm.getDefaultDisplay().getRealMetrics(metrics);
                      int width = Math.max(1, metrics.widthPixels);
                      int height = Math.max(1, metrics.heightPixels);
                      int density = metrics.densityDpi;

                      MediaProjectionManager manager = (MediaProjectionManager) getSystemService(
                              Context.MEDIA_PROJECTION_SERVICE);
                      projection = manager.getMediaProjection(resultCode, data);
                      if (projection == null) {
                          throw new IllegalStateException("MediaProjection null");
                      }

                      projection.registerCallback(
                              new MediaProjection.Callback() {
                                  @Override
                                  public void onStop() {
                                      Log.w(TAG, "PROJECTION_STOPPED_BY_SYSTEM");
                                      handler.post(() -> cleanup(false));
                                  }
                              }, handler);

                      frameCount = 0;
                      stopping = false;
                      imageReader = ImageReader.newInstance(
                              width, height, android.graphics.PixelFormat.RGBA_8888, 3);
                      imageReader.setOnImageAvailableListener(reader -> {
                          Image image = null;
                          try {
                              image = reader.acquireLatestImage();
                              if (image == null) return;
                              frameCount++;
                              int w = image.getWidth();
                              int h = image.getHeight();
                              if (frameCount == 1 || frameCount % 30 == 0) {
                                  Log.i(TAG, "FRAME_OK count=" + frameCount + " size=" + w + "x" + h + " planes=" + image.getPlanes().length);
                                  setStatus("CAPTURE DANG CHAY\n" +
                                          "FRAME_OK: " + frameCount + "\n" +
                                          "Kich thuoc: " + w + " x " + h + "\n" +
                                          "Hay giu ung dung mo khi kiem tra.");
                              }
                          } catch (Throwable e) {
                              Log.e(TAG, "FRAME_READ_FAILED", e);
                              setStatus("FRAME_READ_FAILED: " + e);
                          } finally {
                              if (image != null) image.close();
                          }
                      }, handler);

                      virtualDisplay = projection.createVirtualDisplay(
                              "MIRROR-03A-Capture",
                              width, height, density,
                              DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                              imageReader.getSurface(), null, handler);

                      if (virtualDisplay == null) {
                          throw new IllegalStateException("VirtualDisplay null");
                      }

                      Log.i(TAG, "CAPTURE_STARTED size=" + width + "x" + height + " density=" + density);
                      setStatus("CAPTURE_STARTED\n" +
                              "Man hinh: " + width + " x " + height + "\n" +
                              "Dang doi khung hinh...");
                  } catch (Throwable e) {
                      Log.e(TAG, "CAPTURE_START_FAILED", e);
                      setStatus("CAPTURE_START_FAILED: " + e);
                      cleanup(true);
                  }
              }

              private void setStatus(String message) {
                  handler.post(() -> {
                      if (status != null) status.setText(message);
                  });
              }

              private void stopCapture() {
                  cleanup(true);
              }

              private void cleanup(boolean stopProjection) {
                  MediaProjection oldProjection = projection;
                  projection = null;

                  if (virtualDisplay != null) {
                      try {
                          virtualDisplay.release();
                      } catch (Throwable ignored) {}
                      virtualDisplay = null;
                  }

                  if (imageReader != null) {
                      try {
                          imageReader.setOnImageAvailableListener(null, null);
                      } catch (Throwable ignored) {}
                      try {
                          imageReader.close();
                      } catch (Throwable ignored) {}
                      imageReader = null;
                  }

                  if (stopProjection && oldProjection != null) {
                      try {
                          oldProjection.stop();
                      } catch (Throwable ignored) {}
                  }

                  if (status != null) {
                      status.setText("STOPPED — Da dung chup man hinh");
                  }
                  Log.i(TAG, "CAPTURE_STOPPED frames=" + frameCount);
              }

              @Override
              protected void onDestroy() {
                  cleanup(true);
                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        run: |
          set -euo pipefail
          cd mirror03a
          gradle --no-daemon --stacktrace assembleDebug

      - name: Kiem tra APK va tao SHA256
        run: |
          set -euo pipefail
          APK="mirror03a/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p out
          cp "$APK" out/MIRROR-03A-Capture.apk
          sha256sum out/MIRROR-03A-Capture.apk \
            | tee out/MIRROR-03A-SHA256.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            out/MIRROR-03A-Capture.apk | tee out/MIRROR-03A-badging.txt
          grep -q "com.carassistant.next.mirror03a" out/MIRROR-03A-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree \
            out/MIRROR-03A-Capture.apk AndroidManifest.xml \
            > out/MIRROR-03A-manifest.txt
          grep -q "android.intent.action.MAIN" out/MIRROR-03A-manifest.txt
          echo "MIRROR-03A APK CHECK: PASS"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIRROR-03A-Capture-Test
          path: out/
          if-no-files-found: error
          retention-days: 14
