
name: MIRROR-04D-06 One APK Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-04d-06-one-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify protected CORE
        shell: bash
        run: |
          set -euo pipefail

          verify_sha() {
            local file="$1"
            local expected="$2"
            test -f "$file"
            actual="$(git hash-object "$file")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Protected file SHA mismatch: $file"
              echo "Expected: $expected"
              echo "Actual:   $actual"
              exit 1
            fi
            echo "PASS: $file"
          }

          verify_sha \
            "app/src/main/java/com/carassistant/next/HookEntry.java" \
            "667e759417611d6982bb110ef0583f9513db2c63"

          verify_sha \
            "app/src/main/AndroidManifest.xml" \
            "b23d082324e633bde63f0997e4c90b320f9b69df"

          verify_sha \
            "app/build.gradle" \
            "7be503b5df091734ea6babd3b0108e220272207b"

          verify_sha \
            ".github/workflows/mirror-04d-04-low-latency.yml" \
            "c41eb33d7fd459f0ab4e2d7789b1a200305584ef"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f gradlew ]; then
            echo "::error::gradlew not found at repository root."
            exit 1
          fi
          chmod +x gradlew

      - name: Build existing project
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK and calculate SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find . -path '*/build/outputs/apk/debug/*.apk' \
            -type f -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::No debug APK was generated."
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/CarAssistantNext-MIRROR-04D-06.apk
          sha256sum release/CarAssistantNext-MIRROR-04D-06.apk \
            > release/SHA256SUMS.txt

          cat release/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIRROR-04D-06-One-APK
          path: release/*
          if-no-files-found: error
          retention-days: 14
