name: CarAssistantNext - System Bridge Phase 2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-bridge-phase2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  phase2-display-diagnostics:
    name: Build isolated display diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify protected baseline
        shell: bash
        run: |
          set -euo pipefail

          check_blob() {
            expected="$1"
            path="$2"

            if [ ! -f "$path" ]; then
              echo "::error::Missing protected file: $path"
              exit 1
            fi

            actual="$(git hash-object "$path")"

            if [ "$actual" != "$expected" ]; then
              echo "::error::SHA mismatch: $path"
              echo "Expected: $expected"
              echo "Actual:   $actual"
              exit 1
            fi

            echo "PASS protected: $path"
          }

          check_blob d8ddc5abcd112b233e59cd7898efab51045bea50 \
            app/src/main/java/com/carassistant/next/LauncherShellView.java

          check_blob ca8120b7ad136026caff184a7471914dafbfa708 \
            app/src/main/java/com/carassistant/next/HomeActivity.java

          check_blob c69ffa3e152452b00b2b23dc94922accbd54a3cd \
            app/src/main/java/com/carassistant/next/P2ASurfaceProbeService.java

          check_blob 357f775c8959bfe40010d9b5e2c06a0cb805c32c \
            app/src/main/java/com/carassistant/next/P2ASurfaceProbeSession.java

          check_blob b9bc0ece6b71553a04cb19858ebb642cb13fe59a \
            app/src/main/java/com/carassistant/next/P2ASurfaceProbeScreen.java

          check_blob 30260c84184e972c77b9a2ba583ab0f72d44d197 \
            app/src/main/AndroidManifest.xml

          check_blob c1701bc98aba06cc64292d560f0aaa10e64b622b \
            app/build.gradle

          check_blob 0e224a8ce0f6f9300d357bb9ad305f82b4cd7dde \
            .github/workflows/build-carassistant-next-core.yml

          check_blob 327630789d8ca2737c72b3818f4709ea9e562f67 \
            .github/workflows/patch-p2a-android-auto-surface-probe.yml

          check_blob 0827e8226541f22a7eb06b7d1da37ae0c242ac04 \
            .github/workflows/system-bridge-probe.yml

          echo "PASS: all protected baseline files match."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate isolated Phase 2 project
        shell: bash
        run: |
          set -euo pipefail

          P="$RUNNER_TEMP/system-bridge-phase2"

          mkdir -p \
            "$P/app/src/main/assets" \
            "$P/app/src/main/java/com/carassistant/next/systembridgephase2"

          cat > "$P/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://api.xposed.info/") }
              }
          }

          rootProject.name = "CarAssistantNextSystemBridgePhase2"
          include(":app")
          EOF

          cat > "$P/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.0' apply false
          }
          EOF

          cat > "$P/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > "$P/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.carassistant.next.systembridgephase2'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.carassistant.next.systembridgephase2'
                  minSdk 26
                  targetSdk 32
                  versionCode 2
                  versionName '0.2-phase2'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              compileOnly 'de.robv.android.xposed:api:82'
          }
          EOF

          cat > "$P/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="System Bridge Phase 2"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <meta-data
                      android:name="xposedmodule"
                      android:value="true" />
                  <meta-data
                      android:name="xposeddescription"
                      android:value="Read-only display diagnostics; no display creation or input injection." />
                  <meta-data
                      android:name="xposedminversion"
                      android:value="82" />

                  <activity
                      android:name=".ProbeActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$P/app/src/main/assets/xposed_init" <<'EOF'
          com.carassistant.next.systembridgephase2.SystemBridgePhase2
          EOF

          cat > "$P/app/src/main/java/com/carassistant/next/systembridgephase2/SystemBridgePhase2.java" <<'EOF'
          package com.carassistant.next.systembridgephase2;

          import android.app.Application;
          import android.content.Context;
          import android.hardware.display.DisplayManager;
          import android.os.Build;
          import android.view.Display;

          import java.lang.reflect.Method;
          import java.util.Arrays;
          import java.util.Comparator;

          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          public final class SystemBridgePhase2
                  implements IXposedHookLoadPackage {

              private static final String TAG =
                      "[CarAssistantNext-SystemBridgePhase2]";

              private static void log(String message) {
                  XposedBridge.log(TAG + " " + message);
              }

              @Override
              public void handleLoadPackage(
                      XC_LoadPackage.LoadPackageParam p) {

                  if ("android".equals(p.packageName)) {
                      inspectSystemServer(p.classLoader);
                      return;
                  }

                  if (!"com.google.android.projection.gearhead"
                          .equals(p.packageName)) {
                      return;
                  }

                  log("ANDROID_AUTO_LOAD"
                          + " process=" + p.processName
                          + " sdk=" + Build.VERSION.SDK_INT
                          + " fingerprint=" + Build.FINGERPRINT);

                  try {
                      XposedHelpers.findAndHookMethod(
                          Application.class,
                          "attach",
                          Context.class,
                          new XC_MethodHook() {
                              @Override
                              protected void afterHookedMethod(
                                      MethodHookParam param) {
                                  Object value = param.args[0];
                                  if (!(value instanceof Context)) {
                                      log("DISPLAY_CONTEXT_UNAVAILABLE");
                                      return;
                                  }
                                  inspectDisplays((Context) value);
                              }
                          });
                      log("APPLICATION_ATTACH_HOOK_REGISTERED");
                  } catch (Throwable t) {
                      log("APPLICATION_ATTACH_HOOK_FAILED "
                              + t.getClass().getName()
                              + ": " + String.valueOf(t.getMessage()));
                  }
              }

              private static void inspectDisplays(Context context) {
                  try {
                      DisplayManager manager =
                          (DisplayManager) context.getSystemService(
                              Context.DISPLAY_SERVICE);

                      if (manager == null) {
                          log("DISPLAY_MANAGER_NULL");
                          return;
                      }

                      Display[] displays = manager.getDisplays();
                      log("DISPLAY_ENUMERATION_OK count="
                              + displays.length);

                      Arrays.sort(displays, Comparator.comparingInt(
                          Display::getDisplayId));

                      for (Display display : displays) {
                          try {
                              log("DISPLAY"
                                  + " id=" + display.getDisplayId()
                                  + " name=" + display.getName()
                                  + " flags=" + display.getFlags()
                                  + " state=" + display.getState()
                                  + " valid=" + display.isValid());
                          } catch (Throwable t) {
                              log("DISPLAY_ENTRY_FAILED "
                                  + t.getClass().getName()
                                  + ": " + String.valueOf(t.getMessage()));
                          }
                      }
                  } catch (Throwable t) {
                      log("DISPLAY_ENUMERATION_FAILED "
                          + t.getClass().getName()
                          + ": " + String.valueOf(t.getMessage()));
                  }
              }

              private static void inspectSystemServer(
                      ClassLoader loader) {
                  log("SYSTEM_SERVER_LOAD"
                      + " sdk=" + Build.VERSION.SDK_INT
                      + " fingerprint=" + Build.FINGERPRINT);

                  try {
                      Class<?> service = Class.forName(
                          "com.android.server.display.DisplayManagerService",
                          false,
                          loader);

                      log("DISPLAY_SERVICE_CLASS_FOUND "
                              + service.getName());

                      Method[] methods = service.getDeclaredMethods();
                      Arrays.sort(methods, Comparator.comparing(
                          Method::getName));

                      int matches = 0;
                      for (Method method : methods) {
                          String name = method.getName().toLowerCase();
                          if (name.contains("display")
                                  || name.contains("virtual")) {
                              log("DISPLAY_SERVICE_METHOD "
                                  + method.getName()
                                  + " params="
                                  + method.getParameterCount());
                              matches++;
                          }
                      }

                      log("DISPLAY_SERVICE_METHOD_SCAN_DONE count="
                              + matches);
                  } catch (Throwable t) {
                      log("DISPLAY_SERVICE_INSPECTION_FAILED "
                          + t.getClass().getName()
                          + ": " + String.valueOf(t.getMessage()));
                  }
              }
          }
          EOF

          cat > "$P/app/src/main/java/com/carassistant/next/systembridgephase2/ProbeActivity.java" <<'EOF'
          package com.carassistant.next.systembridgephase2;

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;

          public final class ProbeActivity extends Activity {
              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  TextView view = new TextView(this);
                  view.setTextSize(18f);
                  view.setPadding(32, 32, 32, 32);
                  view.setText(
                      "CarAssistantNext - System Bridge Phase 2\n\n"
                      + "Read-only display diagnostics.\n\n"
                      + "Inspect LSPosed logs for "
                      + "[CarAssistantNext-SystemBridgePhase2].\n\n"
                      + "This app does not create displays, capture or "
                      + "project screen content, or inject input events."
                  );
                  setContentView(view);
              }
          }
          EOF

          echo "PASS: isolated Phase 2 source generated outside repository."

      - name: Build Phase 2 APK
        shell: bash
        run: |
          set -euo pipefail

          P="$RUNNER_TEMP/system-bridge-phase2"
          gradle -p "$P" --no-daemon :app:assembleDebug

          APK="$P/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          mkdir -p artifacts
          cp "$APK" \
            artifacts/CarAssistantNext-SystemBridgePhase2-debug.apk

          unzip -l artifacts/CarAssistantNext-SystemBridgePhase2-debug.apk \
            | grep -F "assets/xposed_init"

          sha256sum \
            artifacts/CarAssistantNext-SystemBridgePhase2-debug.apk \
            | tee artifacts/SHA256SUMS.txt

      - name: Upload Phase 2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistantNext-SystemBridgePhase2
          path: |
            artifacts/CarAssistantNext-SystemBridgePhase2-debug.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
