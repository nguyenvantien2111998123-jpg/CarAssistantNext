name: MIRROR-04D-07 - CORE Build Without Wrapper

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-04d-07-core-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify CORE and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify protected CORE
        shell: bash
        run: |
          set -euo pipefail

          check_sha() {
            local file="$1"
            local expected="$2"

            if [ ! -f "$file" ]; then
              echo "::error::Missing protected file: $file"
              exit 1
            fi

            local actual
            actual="$(git hash-object "$file")"

            if [ "$actual" != "$expected" ]; then
              echo "::error::Protected SHA mismatch: $file"
              echo "Expected: $expected"
              echo "Actual:   $actual"
              exit 1
            fi

            echo "CORE_SHA_PASS $file $actual"
          }

          check_sha \
            app/src/main/java/com/carassistant/next/HookEntry.java \
            667e759417611d6982bb110ef0583f9513db2c63

          check_sha \
            app/src/main/AndroidManifest.xml \
            b23d082324e633bde63f0997e4c90b320f9b69df

          check_sha \
            app/build.gradle \
            7be503b5df091734ea6babd3b0108e220272207b

          check_sha \
            .github/workflows/mirror-04d-04-low-latency.yml \
            c41eb33d7fd459f0ab4e2d7789b1a200305584ef

      - name: Check project structure
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/carassistant/next/HookEntry.java
          test -f app/src/main/java/com/carassistant/next/HomeActivity.java
          test -f app/src/main/assets/xposed_init

          echo "PROJECT_STRUCTURE_PASS"
          echo "Gradle Wrapper absent: using installed Gradle instead."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Verify Gradle and Android SDK
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build existing CORE APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleDebug

      - name: Verify APK and calculate SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          mkdir -p output
          cp "$APK" output/CarAssistantNext-CORE.apk

          sha256sum output/CarAssistantNext-CORE.apk \
            | tee output/SHA256SUMS.txt

          cat > output/BUILD-STATUS.txt <<'EOF'
          Build workflow: MIRROR-04D-07
          Build target: Existing CarAssistantNext CORE
          Gradle Wrapper: Not required by this workflow
          Protected CORE SHA checks: PASS if reached
          APK build: PASS if reached
          Mirror projection: NOT VERIFIED
          Automatic MediaProjection consent: NOT IMPLEMENTED BY THIS BUILD
          Touch forwarding: NOT VERIFIED
          Device test: NOT RUN
          EOF

          cat output/BUILD-STATUS.txt

      - name: Upload APK and build report
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistantNext-CORE-Build
          path: |
            output/CarAssistantNext-CORE.apk
            output/SHA256SUMS.txt
            output/BUILD-STATUS.txt
          if-no-files-found: error
          retention-days: 14
