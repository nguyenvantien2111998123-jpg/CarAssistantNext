name: MIRROR-04D-05C - Android Auto Connection Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-04d-05c-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify MIRROR-04D-05C
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify frozen GD01 core
        shell: bash
        run: |
          set -euo pipefail
          check_sha() {
            local file="$1"
            local expected="$2"
            test -f "$file" || {
              echo "::error::Missing protected file: $file"
              exit 1
            }
            local actual
            actual="$(git hash-object "$file")"
            echo "$file: $actual"
            test "$actual" = "$expected" || {
              echo "::error::Protected SHA mismatch: $file"
              echo "Expected: $expected"
              echo "Actual: $actual"
              exit 1
            }
          }
          check_sha app/src/main/java/com/carassistant/next/HookEntry.java 667e759417611d6982bb110ef0583f9513db2c63
          check_sha app/src/main/AndroidManifest.xml b23d082324e633bde63f0997e4c90b320f9b69df
          check_sha app/build.gradle 7be503b5df091734ea6babd3b0108e220272207b
          echo "GD01_CORE_SHA_PASS"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate isolated 05C project
        shell: bash
        run: |
          set -euo pipefail
          P=mirror0405c
          J="$P/app/src/main/java/com/carassistant/next/mirror0405c"
          mkdir -p "$J" "$P/app/src/main/res/values"

          cat > "$P/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MIRROR-04D-05C"
          include(":app")
          EOF

          cat > "$P/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > "$P/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > "$P/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.carassistant.next.mirror0405c'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.carassistant.next.mirror0405c'
                  minSdk 29
                  targetSdk 32
                  versionCode 407
                  versionName '04D-05C'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > "$P/app/src/main/res/values/strings.xml" <<'EOF'
          <resources>
              <string name="app_name">MIRROR-04D-05C</string>
          </resources>
          EOF

          cat > "$P/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$J/MainActivity.java" <<'EOF'
          package com.carassistant.next.mirror0405c;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.content.pm.PackageInfo;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;

          public final class MainActivity extends Activity {
              private TextView output;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(20, 20, 20, 20);

                  TextView title = new TextView(this);
                  title.setText("MIRROR-04D-05C\nAndroid Auto Diagnostic");
                  title.setTextSize(22);
                  root.addView(title);

                  Button run = new Button(this);
                  run.setText("Run diagnostics (root)");
                  root.addView(run);

                  ScrollView scroll = new ScrollView(this);
                  output = new TextView(this);
                  output.setTextSize(13);
                  output.setTextIsSelectable(true);
                  output.setPadding(0, 16, 0, 16);
                  scroll.addView(output);
                  root.addView(scroll, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, 0, 1));

                  run.setOnClickListener(v -> runDiagnostics());
                  setContentView(root);

                  output.setText(
                      "Press Run diagnostics while Android Auto is connected.\n\n" +
                      "The first root request may show a Magisk prompt.\n" +
                      "This app does not start screen capture or bypass consent.\n"
                  );
              }

              private boolean packageInstalled(String name) {
                  try {
                      PackageInfo ignored = getPackageManager().getPackageInfo(name, 0);
                      return true;
                  } catch (Throwable t) {
                      return false;
                  }
              }

                      
              private String runRootCommand(String command) {
                  Process process = null;
                  try {
                      process = Runtime.getRuntime().exec(
                                 new String[]{"su", "-c", command});

                     // Dùng biến final cho các lambda đọc stdout/stderr.
                     final Process proc = process;

                     ByteArrayOutputStream bytes = new ByteArrayOutputStream();
                     ByteArrayOutputStream errors = new ByteArrayOutputStream();

                     Thread stdout = new Thread(() ->
                         copy(proc.getInputStream(), bytes));

                     Thread stderr = new Thread(() ->
                         copy(proc.getErrorStream(), errors));

                     stdout.start();
                     stderr.start();

                     int code = proc.waitFor();
                     stdout.join();
                     stderr.join();

                     String out = new String(
                         bytes.toByteArray(), StandardCharsets.UTF_8);
                     String err = new String(
                         errors.toByteArray(), StandardCharsets.UTF_8);

                     return "exit=" + code + "\n" + out
                         + (err.isEmpty() ? "" : "\nSTDERR:\n" + err);

                } catch (Throwable t) {
                    return "ROOT_COMMAND_FAILED: " + t;
                } finally {
                    if (process != null) {
                        process.destroy();
                    }
                }
            }


              private InputStream processStream(Process p, boolean stdout) {
                  return stdout ? p.getInputStream() : p.getErrorStream();
              }

              private void copy(InputStream in, ByteArrayOutputStream out) {
                  try (InputStream stream = in) {
                      byte[] buffer = new byte[4096];
                      int n;
                      while ((n = stream.read(buffer)) != -1) {
                          if (out.size() < 200000) {
                              int allowed = Math.min(n, 200000 - out.size());
                              out.write(buffer, 0, allowed);
                          }
                      }
                  } catch (Throwable ignored) {}
              }

              private void runDiagnostics() {
                  output.setText("Collecting diagnostics...\n");
                  new Thread(() -> {
                      StringBuilder report = new StringBuilder();
                      report.append("MIRROR-04D-05C\n");
                      report.append("Package: com.carassistant.next.mirror0405c\n\n");

                      boolean aaInstalled = packageInstalled(
                          "com.google.android.projection.gearhead");
                      report.append("AA_PACKAGE_INSTALLED=")
                            .append(aaInstalled).append("\n\n");

                      report.append("=== ROOT CHECK ===\n");
                      report.append(runRootCommand("id")).append("\n\n");

                      report.append("=== ANDROID AUTO SERVICES ===\n");
                      report.append(runRootCommand(
                          "dumpsys activity services " +
                          "com.google.android.projection.gearhead"))
                            .append("\n\n");

                      report.append("=== ANDROID AUTO PROCESS ===\n");
                      report.append(runRootCommand(
                          "ps -A | grep -i 'projection.gearhead'"))
                            .append("\n\n");

                      report.append("=== DISPLAY DIAGNOSTICS ===\n");
                      report.append(runRootCommand(
                          "dumpsys display | grep -i -E " +
                          "'displaydevice|presentation|virtualdisplay|car'"))
                            .append("\n\n");

                      report.append("=== IMPORTANT LIMITATION ===\n");
                      report.append(
                          "These are diagnostic signals, not a guaranteed " +
                          "Android Auto connection API.\n" +
                          "An installed package or running process alone " +
                          "does not prove an active car session.\n" +
                          "Compare reports while disconnected and while " +
                          "connected, for both wired and wireless AA.\n" +
                          "No MediaProjection session is started by this app.\n");

                      runOnUiThread(() -> output.setText(report.toString()));
                  }).start();
              }
          }
          EOF

      - name: Validate generated project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("mirror0405c/app/src/main/AndroidManifest.xml")
          ET.parse("mirror0405c/app/src/main/res/values/strings.xml")
          p = "mirror0405c/app/src/main/java/com/carassistant/next/mirror0405c/MainActivity.java"
          with open(p, encoding="utf-8") as f:
              source = f.read()
          for marker in [
              "runDiagnostics",
              "com.google.android.projection.gearhead",
              "dumpsys activity services",
              "ROOT_COMMAND_FAILED",
          ]:
              if marker not in source:
                  raise SystemExit("Missing expected source marker: " + marker)
          print("XML_PARSE_PASS")
          print("SOURCE_MARKERS_PASS")
          PY

      - name: Build debug APK
        working-directory: mirror0405c
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK and generate SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK="mirror0405c/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p output
          cp "$APK" output/MIRROR-04D-05C-android-auto-diagnostic.apk
          sha256sum output/MIRROR-04D-05C-android-auto-diagnostic.apk \
            | tee output/SHA256SUMS.txt
          cat > output/BUILD-STATUS.txt <<'EOF'
          Workflow: MIRROR-04D-05C
          Purpose: Android Auto/root diagnostic
          Application ID: com.carassistant.next.mirror0405c
          Protected GD01 SHA checks: PASS if this step is reached
          XML validation: PASS if this step is reached
          Gradle build: PASS if this step is reached
          Device test: NOT RUN
          Wired Android Auto test: REQUIRED
          Wireless Android Auto test: REQUIRED
          Definitive AA connection detection: NOT IMPLEMENTED
          MediaProjection auto-recovery: NOT IMPLEMENTED
          LSPosed hook: NOT IMPLEMENTED
          EOF

      - name: Upload APK and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: MIRROR-04D-05C-Android-Auto-Diagnostic
          path: |
            output/MIRROR-04D-05C-android-auto-diagnostic.apk
            output/SHA256SUMS.txt
            output/BUILD-STATUS.txt
          if-no-files-found: error
          retention-days: 14
