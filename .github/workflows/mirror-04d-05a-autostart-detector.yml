name: MIRROR-04D-05A - AutoStart and Connection Detector

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-04d-05a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify MIRROR-04D-05A
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify frozen GD01 core
        shell: bash
        run: |
          set -euo pipefail
          
          check_sha() {
            local file="$1"
            local expected="$2"
            test -f "$file" || {
              echo "::error::Missing protected file: $file"
              exit 1
            }
            local actual
            actual="$(git hash-object "$file")"
            echo "$file: $actual"
            test "$actual" = "$expected" || {
              echo "::error::Protected SHA mismatch: $file"
              echo "Expected: $expected"
              echo "Actual: $actual"
              exit 1
            }
          }
          
          check_sha app/src/main/java/com/carassistant/next/HookEntry.java 667e759417611d6982bb110ef0583f9513db2c63
          check_sha app/src/main/AndroidManifest.xml b23d082324e633bde63f0997e4c90b320f9b69df
          check_sha app/build.gradle 7be503b5df091734ea6babd3b0108e220272207b
          echo "GD01_CORE_SHA_PASS"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create isolated MIRROR-04D-05A project
        shell: bash
        run: |
          set -euo pipefail
          P=mirror0405a
          J="$P/app/src/main/java/com/carassistant/next/mirror0405a"
          
          mkdir -p "$J" "$P/app/src/main/res/values"
          
          cat > "$P/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MIRROR-04D-05A"
          include(":app")
          EOF
          
          cat > "$P/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          
          cat > "$P/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          
          cat > "$P/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.carassistant.next.mirror0405a'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.carassistant.next.mirror0405a'
                  minSdk 29
                  targetSdk 32
                  versionCode 405
                  versionName '04D-05A'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          
          cat > "$P/app/src/main/res/values/strings.xml" <<'EOF'
          <resources>
              <string name="app_name">MIRROR-04D-05A</string>
          </resources>
          EOF
          
          cat > "$P/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <service
                      android:name=".MonitorService"
                      android:exported="false" />
                      
                  <receiver
                      android:name=".BootConnectionReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.bluetooth.device.action.ACL_CONNECTED" />
                          <action android:name="android.bluetooth.device.action.ACL_DISCONNECTED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF
          
          cat > "$J/State.java" <<'EOF'
          package com.carassistant.next.mirror0405a;
          
          import android.content.Context;
          import android.content.SharedPreferences;
          
          public final class State {
              private static final String PREFS = "mirror0405a_state";
              
              private State() {}
              
              private static SharedPreferences prefs(Context context) {
                  return context.getApplicationContext().getSharedPreferences(
                          PREFS, Context.MODE_PRIVATE);
              }
              
              public static boolean enabled(Context context) {
                  return prefs(context).getBoolean("enabled", true);
              }
              
              public static void setEnabled(Context context, boolean enabled) {
                  prefs(context).edit().putBoolean("enabled", enabled).apply();
                  record(context, enabled ? "MONITOR_ENABLED" : "MONITOR_DISABLED");
              }
              
              public static void record(Context context, String event) {
                  prefs(context).edit()
                          .putString("last_event", event)
                          .putLong("last_time", System.currentTimeMillis())
                          .apply();
              }
              
              public static String lastEvent(Context context) {
                  return prefs(context).getString("last_event", "NO_EVENT_YET");
              }
              
              public static long lastTime(Context context) {
                  return prefs(context).getLong("last_time", 0L);
              }
          }
          EOF
          
          cat > "$J/BootConnectionReceiver.java" <<'EOF'
          package com.carassistant.next.mirror0405a;
          
          import android.bluetooth.BluetoothDevice;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.util.Log;
          
          public final class BootConnectionReceiver extends BroadcastReceiver {
              private static final String TAG = "MIRROR0405A";
              
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (intent == null || intent.getAction() == null) {
                      return;
                  }
                  String action = intent.getAction();
                  Log.i(TAG, "EVENT=" + action);
                  
                  if (Intent.ACTION_BOOT_COMPLETED.equals(action)) {
                      State.record(context, "BOOT_COMPLETED");
                      if (State.enabled(context)) {
                          MonitorService.start(context, "BOOT_COMPLETED");
                      }
                      return;
                  }
                  
                  if (BluetoothDevice.ACTION_ACL_CONNECTED.equals(action)) {
                      State.record(context, "BLUETOOTH_ACL_CONNECTED");
                      if (State.enabled(context)) {
                          MonitorService.start(context, "BLUETOOTH_ACL_CONNECTED");
                      }
                      return;
                  }
                  
                  if (BluetoothDevice.ACTION_ACL_DISCONNECTED.equals(action)) {
                      State.record(context, "BLUETOOTH_ACL_DISCONNECTED");
                  }
              }
          }
          EOF
          
          cat > "$J/MonitorService.java" <<'EOF'
          package com.carassistant.next.mirror0405a;
          
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          
          public final class MonitorService extends Service {
              private static final String CHANNEL_ID = "mirror0405a_monitor";
              private static final int NOTIFICATION_ID = 405;
              
              public static void start(Context context, String reason) {
                  Intent intent = new Intent(context, MonitorService.class);
                  intent.putExtra("reason", reason);
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          context.startForegroundService(intent);
                      } else {
                          context.startService(intent);
                      }
                  } catch (Throwable error) {
                      State.record(context, "SERVICE_START_FAILED: " + error);
                  }
              }
              
              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();
                  Notification notification = new Notification.Builder(this, CHANNEL_ID)
                          .setContentTitle("MIRROR-04D-05A")
                          .setContentText("Boot and connection monitor is running")
                          .setSmallIcon(android.R.drawable.ic_menu_view)
                          .setOngoing(true)
                          .build();
                  startForeground(NOTIFICATION_ID, notification);
              }
              
              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  String reason = intent == null ? "SERVICE_RESTARTED" : intent.getStringExtra("reason");
                  if (reason == null) {
                      reason = "SERVICE_STARTED";
                  }
                  State.record(this, "SERVICE_RUNNING: " + reason);
                  return START_STICKY;
              }
              
              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) {
                          manager.createNotificationChannel(
                                  new NotificationChannel(
                                          CHANNEL_ID,
                                          "MIRROR-04D-05A Monitor",
                                          NotificationManager.IMPORTANCE_LOW));
                      }
                  }
              }
              
              @Override
              public void onTaskRemoved(Intent rootIntent) {
                  super.onTaskRemoved(rootIntent);
                  State.record(this, "TASK_REMOVED");
              }
              
              @Override
              public void onDestroy() {
                  State.record(this, "SERVICE_DESTROYED");
                  super.onDestroy();
              }
              
              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF
          
          cat > "$J/MainActivity.java" <<'EOF'
          package com.carassistant.next.mirror0405a;
          
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          
          public final class MainActivity extends Activity {
              private TextView status;
              
              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24, 24, 24, 24);
                  
                  TextView title = new TextView(this);
                  title.setText("MIRROR-04D-05A\nAutoStart Detector");
                  title.setTextSize(24);
                  root.addView(title);
                  
                  status = new TextView(this);
                  status.setTextSize(16);
                  status.setPadding(0, 24, 0, 24);
                  root.addView(status, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 0, 1));
                          
                  Button start = new Button(this);
                  start.setText("Enable monitor and start service");
                  start.setOnClickListener(v -> {
                      State.setEnabled(this, true);
                      MonitorService.start(this, "MANUAL_START");
                      refresh();
                  });
                  root.addView(start);
                  
                  Button stop = new Button(this);
                  stop.setText("Disable monitor");
                  stop.setOnClickListener(v -> {
                      State.setEnabled(this, false);
                      stopService(new Intent(this, MonitorService.class));
                      refresh();
                  });
                  root.addView(stop);
                  
                  Button refreshButton = new Button(this);
                  refreshButton.setText("Refresh diagnostics");
                  refreshButton.setOnClickListener(v -> refresh());
                  root.addView(refreshButton);
                  
                  setContentView(root);
                  refresh();
              }
              
              @Override
              protected void onResume() {
                  super.onResume();
                  refresh();
              }
              
              private void refresh() {
                  if (status == null) {
                      return;
                  }
                  status.setText(
                          "Package: com.carassistant.next.mirror0405a\n" +
                          "Monitor enabled: " + State.enabled(this) + "\n" +
                          "Last event: " + State.lastEvent(this) + "\n" +
                          "Event timestamp: " + State.lastTime(this) + "\n\n" +
                          "This is a boot/connection diagnostic only.\n" +
                          "It does not capture or mirror the phone screen.\n" +
                          "Bluetooth ACL events do not prove Android Auto is connected.");
              }
          }
          EOF

      - name: Validate generated project
        shell: bash
        run: |
          set -euo pipefail
          test -s mirror0405a/app/src/main/AndroidManifest.xml
          test -s mirror0405a/app/src/main/java/com/carassistant/next/mirror0405a/MainActivity.java
          test -s mirror0405a/app/src/main/java/com/carassistant/next/mirror0405a/BootConnectionReceiver.java
          test -s mirror0405a/app/src/main/java/com/carassistant/next/mirror0405a/MonitorService.java
          
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("mirror0405a/app/src/main/AndroidManifest.xml")
          ET.parse("mirror0405a/app/src/main/res/values/strings.xml")
          print("XML_PARSE_PASS")
          PY

      - name: Build debug APK
        working-directory: mirror0405a
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK and generate SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK="mirror0405a/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p output
          cp "$APK" output/MIRROR-04D-05A-autostart-detector.apk
          
          sha256sum output/MIRROR-04D-05A-autostart-detector.apk \
            | tee output/SHA256SUMS.txt
            
          cat > output/BUILD-STATUS.txt <<'EOF'
          Workflow: MIRROR-04D-05A
          Purpose: Boot and Bluetooth ACL connection detector
          Application ID: com.carassistant.next.mirror0405a
          Protected GD01 SHA checks: PASS if workflow reaches this step
          XML validation: PASS if workflow reaches this step
          APK build: PASS if workflow reaches this step
          Device test: NOT RUN
          Boot receiver: MUST TEST ON DEVICE
          Bluetooth connection detection: MUST TEST ON DEVICE
          Android Auto connection confirmed: NOT PROVEN BY BLUETOOTH ACL
          MediaProjection capture: NOT IMPLEMENTED
          Automatic screen mirroring: NOT IMPLEMENTED
          MediaProjection consent persistence across reboot: NOT IMPLEMENTED
          EOF

      - name: Upload APK and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: MIRROR-04D-05A-AutoStart-Detector
          path: |
            output/MIRROR-04D-05A-autostart-detector.apk
            output/SHA256SUMS.txt
            output/BUILD-STATUS.txt
          if-no-files-found: error
          retention-days: 14
