name: MIRROR-04D-07B - Root Auto Permission

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-04d-07b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build root permission helper APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify frozen core and protected workflows
        shell: bash
        run: |
          set -euo pipefail

          check_sha() {
            actual="$(git hash-object "$1")"
            echo "$1: $actual"
            test "$actual" = "$2" || {
              echo "::error::Protected SHA mismatch: $1"
              exit 1
            }
          }

          check_sha app/src/main/java/com/carassistant/next/HookEntry.java 667e759417611d6982bb110ef0583f9513db2c63
          check_sha app/src/main/AndroidManifest.xml b23d082324e633bde63f0997e4c90b320f9b69df
          check_sha app/build.gradle 7be503b5df091734ea6babd3b0108e220272207b
          check_sha .github/workflows/mirror-04d-04-low-latency.yml c41eb33d7fd459f0ab4e2d7789b1a200305584ef
          check_sha .github/workflows/mirror-04d-05a-autostart-detector.yml b6ba7943fd08c2496d9a103931982f97219c96c7
          check_sha .github/workflows/mirror-04d-05d-connection-signal-verification.yml 4ac5a4fe8507a86df8c53d50d4fe07d82ac3de6f

          echo "PROTECTED_SHA_CHECK_PASS"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate isolated helper APK
        shell: bash
        run: |
          set -euo pipefail

          P=mirror0407b
          J="$P/app/src/main/java/com/carassistant/next/mirror0407b"
          mkdir -p "$J"

          cat > "$P/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MIRROR-04D-07B"
          include(":app")
          EOF

          cat > "$P/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > "$P/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > "$P/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.carassistant.next.mirror0407b'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.carassistant.next.mirror0407b'
                  minSdk 29
                  targetSdk 32
                  versionCode 407
                  versionName '04D-07B'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > "$P/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

              <application
                  android:allowBackup="false"
                  android:label="MIRROR-04D-07B Root Permission"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$J/MainActivity.java" <<'EOF'
          package com.carassistant.next.mirror0407b;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Typeface;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.util.concurrent.TimeUnit;

          public final class MainActivity extends Activity {
              private static final String TARGET =
                  "com.carassistant.next.mirror0404";

              private TextView result;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(20, 20, 20, 20);

                  TextView title = new TextView(this);
                  title.setText("MIRROR-04D-07B\nRoot Auto Permission");
                  title.setTextSize(22);
                  title.setTypeface(null, Typeface.BOLD);
                  root.addView(title);

                  TextView info = new TextView(this);
                  info.setText(
                      "\nTarget package:\n" + TARGET +
                      "\n\n1. Install the MIRROR-04D-04 APK first." +
                      "\n2. Grant root access to this helper in Magisk." +
                      "\n3. Press the button below." +
                      "\n\nThis helper sets PROJECT_MEDIA AppOps and " +
                      "opens the target app. It does not click or " +
                      "suppress Android system consent dialogs.");
                  root.addView(info);

                  Button run = new Button(this);
                  run.setText("Set root AppOps and open mirror");
                  root.addView(run);

                  ScrollView scroll = new ScrollView(this);
                  result = new TextView(this);
                  result.setTextIsSelectable(true);
                  result.setPadding(0, 16, 0, 16);
                  scroll.addView(result);
                  root.addView(scroll, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, 0, 1));

                  run.setOnClickListener(v -> {
                      run.setEnabled(false);
                      result.setText("Running root commands...");
                      new Thread(() -> {
                          String report = configureAndLaunch();
                          runOnUiThread(() -> {
                              result.setText(report);
                              run.setEnabled(true);
                          });
                      }).start();
                  });

                  setContentView(root);
              }

              private String configureAndLaunch() {
                  StringBuilder report = new StringBuilder();

                  report.append("TARGET=").append(TARGET).append("\n");

                  String installed = rootCommand(
                      "pm path " + TARGET);

                  report.append("\nPACKAGE CHECK:\n")
                      .append(installed).append("\n");

                  if (!installed.contains("package:")) {
                      return report.append(
                          "STOP: Install MIRROR-04D-04 APK first.")
                          .toString();
                  }

                  String appops = rootCommand(
                      "appops set " + TARGET +
                      " PROJECT_MEDIA allow" +
                      " && appops get " + TARGET + " PROJECT_MEDIA");

                  report.append("PROJECT_MEDIA RESULT:\n")
                      .append(appops).append("\n");

                  String launch = rootCommand(
                      "am start -n " + TARGET + "/.MainActivity");

                  report.append("LAUNCH RESULT:\n")
                      .append(launch).append("\n");

                  report.append(
                      "\nTEST: Check whether the mirror app still " +
                      "shows the system screen-capture consent dialog. " +
                      "AppOps success alone does not prove that " +
                      "consent is bypassed.");

                  return report.toString();
              }

              private String rootCommand(String command) {
                  Process process = null;
                  try {
                      process = Runtime.getRuntime().exec(
                          new String[]{"su", "-c", command});

                      if (!process.waitFor(8, TimeUnit.SECONDS)) {
                          process.destroyForcibly();
                          return "ROOT_COMMAND_TIMEOUT";
                      }

                      StringBuilder out = new StringBuilder();
                      try (BufferedReader reader = new BufferedReader(
                              new InputStreamReader(
                                  process.getInputStream()))) {
                          String line;
                          while ((line = reader.readLine()) != null) {
                              out.append(line).append('\n');
                          }
                      }

                      try (BufferedReader reader = new BufferedReader(
                              new InputStreamReader(
                                  process.getErrorStream()))) {
                          String line;
                          while ((line = reader.readLine()) != null) {
                              out.append("STDERR: ")
                                  .append(line).append('\n');
                          }
                      }

                      out.append("EXIT_CODE=")
                          .append(process.exitValue());

                      return out.toString();
                  } catch (Throwable e) {
                      return "ROOT_COMMAND_FAILED: " + e;
                  } finally {
                      if (process != null) process.destroy();
                  }
              }
          }
          EOF

          echo "HELPER_SOURCE_CREATED"

      - name: Build APK
        working-directory: mirror0407b
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK and generate SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK="mirror0407b/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          mkdir -p output
          cp "$APK" output/MIRROR-04D-07B-root-auto-permission.apk
          sha256sum output/MIRROR-04D-07B-root-auto-permission.apk \
            | tee output/SHA256SUMS.txt

          cat > output/BUILD-STATUS.txt <<'EOF'
          Workflow: MIRROR-04D-07B
          Purpose: Root AppOps permission helper
          Helper package: com.carassistant.next.mirror0407b
          Target package: com.carassistant.next.mirror0404
          Protected SHA checks: PASS if this step is reached
          Gradle APK build: PASS if this step is reached
          Device test: NOT RUN
          MediaProjection consent bypass: NOT CONFIRMED
          Full automatic mirroring: NOT CONFIRMED
          EOF

      - name: Upload APK and build status
        uses: actions/upload-artifact@v4
        with:
          name: MIRROR-04D-07B-Root-Auto-Permission
          path: |
            output/MIRROR-04D-07B-root-auto-permission.apk
            output/SHA256SUMS.txt
            output/BUILD-STATUS.txt
          if-no-files-found: error
          retention-days: 14
