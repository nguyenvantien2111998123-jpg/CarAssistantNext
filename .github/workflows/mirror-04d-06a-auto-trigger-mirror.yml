name: MIRROR-04D-06A - Auto Trigger Mirror

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-04d-06a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build isolated 06A auto-trigger APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify frozen core and protected workflows
        shell: bash
        run: |
          set -euo pipefail

          check_sha() {
            local file="$1"
            local expected="$2"
            test -f "$file" || {
              echo "::error::Missing protected file: $file"
              exit 1
            }
            local actual
            actual="$(git hash-object "$file")"
            echo "$file: $actual"
            test "$actual" = "$expected" || {
              echo "::error::Protected SHA mismatch: $file"
              echo "Expected: $expected"
              echo "Actual: $actual"
              exit 1
            }
          }

          check_sha app/src/main/java/com/carassistant/next/HookEntry.java 667e759417611d6982bb110ef0583f9513db2c63
          check_sha app/src/main/AndroidManifest.xml b23d082324e633bde63f0997e4c90b320f9b69df
          check_sha app/build.gradle 7be503b5df091734ea6babd3b0108e220272207b
          check_sha .github/workflows/mirror-04d-04-low-latency.yml c41eb33d7fd459f0ab4e2d7789b1a200305584ef
          check_sha .github/workflows/mirror-04d-05a-autostart-detector.yml b6ba7943fd08c2496d9a103931982f97219c96c7
          check_sha .github/workflows/mirror-04d-05d-connection-signal-verification.yml 4ac5a4fe8507a86df8c53d50d4fe07d82ac3de6f

          echo "PROTECTED_SHA_CHECK_PASS"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate isolated 06A project from frozen 04D-04 source
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          import textwrap
          import xml.etree.ElementTree as ET

          source_path = ".github/workflows/mirror-04d-04-low-latency.yml"
          with open(source_path, encoding="utf-8") as f:
              source = f.read()

          pattern = re.compile(
              r"^[ \t]*cat > (\"?\$(?:P|SRC)/[^\"\n]+\"?) <<'EOF'\n"
              r"([\s\S]*?)^[ \t]*EOF[ \t]*$",
              re.MULTILINE,
          )

          project = "mirror0406a"
          java_dir = (
              project
              + "/app/src/main/java/com/carassistant/next/mirror0406a"
          )
          extracted = {}

          for match in pattern.finditer(source):
              destination = match.group(1).strip('"')
              body = textwrap.dedent(match.group(2))

              if destination.startswith("$P/"):
                  relative = destination[3:]
              elif destination.startswith("$SRC/"):
                  relative = (
                      "app/src/main/java/com/carassistant/next/mirror0406a/"
                      + destination[len("$SRC/"):]
                  )
              else:
                  continue

              body = body.replace("mirror0404", "mirror0406a")
              body = body.replace("MIRROR-04D-04", "MIRROR-04D-06A")
              body = body.replace("versionCode 404", "versionCode 409")
              body = body.replace(
                  "versionName '04D-04'", "versionName '04D-06A'"
              )

              extracted[relative] = body

          required = [
              "settings.gradle",
              "build.gradle",
              "gradle.properties",
              "app/build.gradle",
              "app/src/main/AndroidManifest.xml",
              "app/src/main/res/xml/automotive_app_desc.xml",
              "app/src/main/java/com/carassistant/next/mirror0406a/FrameStore.java",
              "app/src/main/java/com/carassistant/next/mirror0406a/MainActivity.java",
              "app/src/main/java/com/carassistant/next/mirror0406a/ProjectionService.java",
              "app/src/main/java/com/carassistant/next/mirror0406a/MirrorCarAppService.java",
              "app/src/main/java/com/carassistant/next/mirror0406a/MirrorSession.java",
              "app/src/main/java/com/carassistant/next/mirror0406a/MirrorScreen.java",
          ]

          missing = [p for p in required if p not in extracted]
          if missing:
              raise SystemExit(
                  "Could not extract frozen 04D-04 sources: "
                  + ", ".join(missing)
              )

          for relative, body in extracted.items():
              path = os.path.join(project, relative)
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(body)

          manifest_path = project + "/app/src/main/AndroidManifest.xml"
          with open(manifest_path, encoding="utf-8") as f:
              manifest = f.read()

          manifest = manifest.replace(
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
              1,
          )

          additions = """
              <service
                  android:name=".ConnectionMonitorService"
                  android:exported="false"
                  android:foregroundServiceType="dataSync" />

              <receiver
                  android:name=".BootReceiver"
                  android:enabled="true"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED" />
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                  </intent-filter>
              </receiver>
          """

          manifest = manifest.replace(
              "    </application>",
              additions + "\n    </application>",
              1,
          )

          ET.fromstring(manifest)
          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(manifest)

          main_path = java_dir + "/MainActivity.java"
          with open(main_path, encoding="utf-8") as f:
              main = f.read()

          anchor = re.compile(
              r"(?m)^([ \t]*)setContentView\(layout\);\n"
              r"\1refreshInfo\(\);"
          )

          def patch_main(match):
              indent = match.group(1)
              return (
                  indent + "setContentView(layout);\n"
                  + indent + "try {\n"
                  + indent + "    startForegroundService(new Intent(this, ConnectionMonitorService.class));\n"
                  + indent + "} catch (Throwable ignored) {}\n"
                  + indent + "refreshInfo();\n"
                  + indent + "if (getIntent().getBooleanExtra(\"auto_capture\", false)) {\n"
                  + indent + "    new android.os.Handler(getMainLooper()).postDelayed(() -> {\n"
                  + indent + "        MediaProjectionManager manager =\n"
                  + indent + "            (MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE);\n"
                  + indent + "        startActivityForResult(manager.createScreenCaptureIntent(), REQUEST_CAPTURE);\n"
                  + indent + "    }, 1200);\n"
                  + indent + "}"
              )

          main, count = anchor.subn(patch_main, main, count=1)
          if count != 1:
              raise SystemExit("MainActivity patch anchor mismatch")

          with open(main_path, "w", encoding="utf-8") as f:
              f.write(main)

          boot_source = r'''package com.carassistant.next.mirror0406a;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public final class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (intent == null) return;
                  String action = intent.getAction();
                  if (!"android.intent.action.BOOT_COMPLETED".equals(action)
                          && !"android.intent.action.MY_PACKAGE_REPLACED".equals(action)) return;
                  try {
                      context.startForegroundService(
                          new Intent(context, ConnectionMonitorService.class));
                  } catch (Throwable ignored) {}
              }
          }
          '''

          monitor_source = r'''package com.carassistant.next.mirror0406a;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.util.concurrent.TimeUnit;

          public final class ConnectionMonitorService extends Service {
              public static volatile String status = "MONITOR_NOT_STARTED";
              private volatile boolean running;
              private volatile boolean triggerSent;
              private Thread worker;

              @Override
              public void onCreate() {
                  super.onCreate();
                  startForeground(406, buildNotification("Waiting for Android Auto"));
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (worker == null || !worker.isAlive()) {
                      running = true;
                      worker = new Thread(this::monitorLoop, "MirrorConnectionMonitor");
                      worker.start();
                  }
                  return START_STICKY;
              }

              private void monitorLoop() {
                  while (running) {
                      try {
                          boolean connected = detectConnection();
                          if (connected) {
                              status = "AA_SIGNAL_CONNECTED";
                              if (!triggerSent) {
                                  triggerSent = true;
                                  if (!captureAlreadyActive()) launchConsentActivity();
                              }
                          } else {
                              status = "AA_SIGNAL_DISCONNECTED_OR_UNKNOWN";
                              triggerSent = false;
                          }
                          updateNotification(status);
                          Thread.sleep(5000);
                      } catch (InterruptedException e) {
                          Thread.currentThread().interrupt();
                          return;
                      } catch (Throwable e) {
                          status = "DETECTOR_ERROR:" + e.getClass().getSimpleName();
                          try { Thread.sleep(5000); }
                          catch (InterruptedException ignored) {
                              Thread.currentThread().interrupt();
                              return;
                          }
                      }
                  }
              }

              private boolean detectConnection() {
                  String command =
                      "D=$(dumpsys display 2>/dev/null); " +
                      "B=$(printf '%s\\\\n' \\\"$D\\\" | " +
                      "grep -i -B 8 -A 12 'com.google.android.projection.gearhead' || true); " +
                      "if printf '%s\\\\n' \\\"$B\\\" | grep -qi 'FLAG_PRESENTATION' " +
                      "&& printf '%s\\\\n' \\\"$B\\\" | grep -Eqi 'state=ON|mState=ON'; " +
                      "then echo AA_CONNECTED; else echo AA_NOT_CONFIRMED; fi";
                  String out = runRoot(command);
                  return out.contains("AA_CONNECTED");
              }

              private String runRoot(String command) {
                  Process process = null;
                  try {
                      process = Runtime.getRuntime().exec(new String[]{"su", "-c", command});
                      if (!process.waitFor(4, TimeUnit.SECONDS)) {
                          process.destroyForcibly();
                          return "ROOT_COMMAND_TIMEOUT";
                      }
                      StringBuilder out = new StringBuilder();
                      try (BufferedReader reader = new BufferedReader(
                              new InputStreamReader(process.getInputStream()))) {
                          String line;
                          while ((line = reader.readLine()) != null) {
                              out.append(line).append('\n');
                          }
                      }
                      if (process.exitValue() != 0) return "ROOT_COMMAND_FAILED";
                      return out.toString();
                  } catch (Throwable e) {
                      return "ROOT_UNAVAILABLE:" + e.getClass().getSimpleName();
                  } finally {
                      if (process != null) process.destroy();
                  }
              }

              private boolean captureAlreadyActive() {
                  String s = FrameStore.projectionStatus;
                  return "CAPTURE_STARTED".equals(s) || "FRAME_OK".equals(s);
              }

              private void launchConsentActivity() {
                  String result = runRoot(
                      "am start -n com.carassistant.next.mirror0406a/.MainActivity --ez auto_capture true");
                  status = result.contains("ROOT_COMMAND_FAILED")
                      ? "AA_CONNECTED_ACTIVITY_LAUNCH_FAILED"
                      : "AA_CONNECTED_CONSENT_REQUESTED";
              }

              private Notification buildNotification(String text) {
                  String channel = "mirror0406a_monitor";
                  NotificationManager manager = getSystemService(NotificationManager.class);
                  if (Build.VERSION.SDK_INT >= 26) {
                      manager.createNotificationChannel(new NotificationChannel(
                          channel, "Mirror auto connection", NotificationManager.IMPORTANCE_LOW));
                  }
                  Notification.Builder builder = Build.VERSION.SDK_INT >= 26
                      ? new Notification.Builder(this, channel)
                      : new Notification.Builder(this);
                  return builder.setContentTitle("MIRROR-04D-06A")
                      .setContentText(text)
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .build();
              }

              private void updateNotification(String text) {
                  try {
                      getSystemService(NotificationManager.class)
                          .notify(406, buildNotification(text));
                  } catch (Throwable ignored) {}
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public void onDestroy() {
                  running = false;
                  if (worker != null) worker.interrupt();
                  super.onDestroy();
              }
          }
          '''

          for name, body in [
              ("BootReceiver.java", boot_source),
              ("ConnectionMonitorService.java", monitor_source),
          ]:
              with open(os.path.join(java_dir, name), "w", encoding="utf-8") as f:
                  f.write(textwrap.dedent(body))

          for name in ["BootReceiver.java", "ConnectionMonitorService.java"]:
              path = os.path.join(java_dir, name)
              with open(path, encoding="utf-8") as f:
                  if not f.read().strip():
                      raise SystemExit("Empty Java source: " + name)

          print("SOURCE_EXTRACTION_PASS")
          print("MANIFEST_XML_PARSE_PASS")
          print("MAIN_ACTIVITY_AUTO_TRIGGER_PATCH_PASS")
          print("NEW_MONITOR_SOURCES_PASS")
          PY

      - name: Build APK
        working-directory: mirror0406a
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK and SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK="mirror0406a/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p output
          cp "$APK" output/MIRROR-04D-06A-auto-trigger-mirror.apk
          sha256sum output/MIRROR-04D-06A-auto-trigger-mirror.apk \
            | tee output/SHA256SUMS.txt

          cat > output/BUILD-STATUS.txt <<'EOF'
          Workflow: MIRROR-04D-06A
          Purpose: Root-based connection detection and capture-consent trigger
          Application ID: com.carassistant.next.mirror0406a
          Frozen core SHA checks: PASS if this step is reached
          Protected workflow SHA checks: PASS if this step is reached
          Source extraction: PASS if this step is reached
          Manifest XML validation: PASS if this step is reached
          Gradle APK build: PASS if this step is reached
          Device test: NOT RUN
          USB detector: MUST TEST ON DEVICE
          Wireless detector: MUST TEST ON DEVICE
          Boot receiver: MUST TEST ON DEVICE
          MediaProjection consent: REQUIRED FOR EACH NEW SESSION
          Android Auto car-app auto-opening: NOT IMPLEMENTED
          Full unattended mirroring: NOT YET CONFIRMED
          EOF

      - name: Upload APK and build status
        uses: actions/upload-artifact@v4
        with:
          name: MIRROR-04D-06A-Auto-Trigger-Mirror
          path: |
            output/MIRROR-04D-06A-auto-trigger-mirror.apk
            output/SHA256SUMS.txt
            output/BUILD-STATUS.txt
          if-no-files-found: error
          retention-days: 14
