name: MIRROR-04D-05D - Connection Signal Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-04d-05d-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build isolated 05D diagnostic APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify frozen core and protected workflows
        shell: bash
        run: |
          set -euo pipefail

          check_sha() {
            local file="$1"
            local expected="$2"

            test -f "$file" || {
              echo "::error::Missing protected file: $file"
              exit 1
            }

            local actual
            actual="$(git hash-object "$file")"
            echo "$file: $actual"

            if [ "$actual" != "$expected" ]; then
              echo "::error::Protected SHA mismatch: $file"
              echo "Expected: $expected"
              echo "Actual: $actual"
              exit 1
            fi
          }

          check_sha \
            app/src/main/java/com/carassistant/next/HookEntry.java \
            667e759417611d6982bb110ef0583f9513db2c63

          check_sha \
            app/src/main/AndroidManifest.xml \
            b23d082324e633bde63f0997e4c90b320f9b69df

          check_sha \
            app/build.gradle \
            7be503b5df091734ea6babd3b0108e220272207b

          check_sha \
            .github/workflows/mirror-04d-04-low-latency.yml \
            c41eb33d7fd459f0ab4e2d7789b1a200305584ef

          check_sha \
            .github/workflows/mirror-04d-05a-autostart-detector.yml \
            b6ba7943fd08c2496d9a103931982f97219c96c7

          echo "PROTECTED_SHA_CHECK_PASS"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate isolated 05D project
        shell: bash
        run: |
          set -euo pipefail

          P=mirror0405d
          J="$P/app/src/main/java/com/carassistant/next/mirror0405d"
          mkdir -p "$J" "$P/app/src/main/res/values"

          cat > "$P/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MIRROR-04D-05D"
          include(":app")
          EOF

          cat > "$P/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > "$P/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > "$P/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.carassistant.next.mirror0405d'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.carassistant.next.mirror0405d'
                  minSdk 29
                  targetSdk 32
                  versionCode 408
                  versionName '04D-05D'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > "$P/app/src/main/res/values/strings.xml" <<'EOF'
          <resources>
              <string name="app_name">MIRROR-04D-05D</string>
          </resources>
          EOF

          cat > "$P/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission
                  android:name="android.permission.QUERY_ALL_PACKAGES" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$J/MainActivity.java" <<'EOF'
          package com.carassistant.next.mirror0405d;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.LinkedHashSet;
          import java.util.Set;

          public final class MainActivity extends Activity {
              private TextView output;
              private Button buttonA;
              private Button buttonB;
              private Button compareButton;

              private String snapshotA;
              private String snapshotB;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(18, 18, 18, 18);

                  TextView title = new TextView(this);
                  title.setText(
                      "MIRROR-04D-05D\nConnection Signal Verification");
                  title.setTextSize(21);
                  root.addView(title);

                  TextView instructions = new TextView(this);
                  instructions.setText(
                      "A: Android Auto NOT connected. Save A first.\n" +
                      "B: Android Auto connected and visible on car screen.\n" +
                      "Then compare. Repeat for wireless AA if available.\n" +
                      "Diagnostic only: does not start screen capture.");
                  root.addView(instructions);

                  buttonA = new Button(this);
                  buttonA.setText("1. Save A - DISCONNECTED");
                  root.addView(buttonA);

                  buttonB = new Button(this);
                  buttonB.setText("2. Save B - CONNECTED");
                  root.addView(buttonB);

                  compareButton = new Button(this);
                  compareButton.setText("3. Compare A and B");
                  root.addView(compareButton);

                  Button copyButton = new Button(this);
                  copyButton.setText("Copy report");
                  root.addView(copyButton);

                  ScrollView scroll = new ScrollView(this);
                  output = new TextView(this);
                  output.setTextSize(12);
                  output.setTextIsSelectable(true);
                  output.setPadding(0, 12, 0, 12);
                  scroll.addView(output);

                  root.addView(scroll, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, 0, 1));

                  buttonA.setOnClickListener(v -> capture(true));
                  buttonB.setOnClickListener(v -> capture(false));
                  compareButton.setOnClickListener(v -> compare());

                  copyButton.setOnClickListener(v -> {
                      ClipboardManager clipboard =
                          (ClipboardManager) getSystemService(
                              Context.CLIPBOARD_SERVICE);

                      clipboard.setPrimaryClip(ClipData.newPlainText(
                          "MIRROR-04D-05D report",
                          output.getText().toString()));

                      output.append("\nREPORT_COPIED_TO_CLIPBOARD");
                  });

                  setContentView(root);

                  output.setText(
                      "Ready.\n" +
                      "1. Save A while disconnected.\n" +
                      "2. Connect Android Auto and wait for the car UI.\n" +
                      "3. Save B, then compare.\n" +
                      "Approve the Magisk root prompt if it appears.\n");
              }

              private void setBusy(boolean busy) {
                  buttonA.setEnabled(!busy);
                  buttonB.setEnabled(!busy);
                  compareButton.setEnabled(!busy);
              }

              private String runRootCommand(String command) {
                  Process process = null;

                  try {
                      process = Runtime.getRuntime().exec(
                          new String[]{"su", "-c", command});

                      final Process proc = process;
                      ByteArrayOutputStream stdout =
                          new ByteArrayOutputStream();
                      ByteArrayOutputStream stderr =
                          new ByteArrayOutputStream();

                      Thread outThread = new Thread(() ->
                          copy(proc.getInputStream(), stdout));

                      Thread errThread = new Thread(() ->
                          copy(proc.getErrorStream(), stderr));

                      outThread.start();
                      errThread.start();

                      int exit = proc.waitFor();
                      outThread.join();
                      errThread.join();

                      String outText = new String(
                          stdout.toByteArray(), StandardCharsets.UTF_8);

                      String errText = new String(
                          stderr.toByteArray(), StandardCharsets.UTF_8);

                      return "exit=" + exit + "\n" + outText +
                          (errText.isEmpty()
                              ? ""
                              : "\nSTDERR:\n" + errText);

                  } catch (Throwable t) {
                      return "COMMAND_FAILED: " + t;
                  } finally {
                      if (process != null) {
                          process.destroy();
                      }
                  }
              }

              private void copy(
                  InputStream in, ByteArrayOutputStream out) {
                  try (InputStream stream = in) {
                      byte[] buffer = new byte[4096];
                      int n;

                      while ((n = stream.read(buffer)) != -1) {
                          if (out.size() < 250000) {
                              int allowed = Math.min(
                                  n, 250000 - out.size());
                              out.write(buffer, 0, allowed);
                          }
                      }
                  } catch (Throwable ignored) {
                  }
              }

              private String captureRaw() {
                  StringBuilder raw = new StringBuilder();

                  raw.append("=== DISPLAY ===\n");
                  raw.append(runRootCommand(
                      "dumpsys display | grep -i -E " +
                      "'DisplayDeviceInfo|uniqueId=|ownerUid|" +
                      "ownerPackageName|state=|FLAG_PRESENTATION|" +
                      "FLAG_PRIVATE|mDisplayId|VirtualDisplayAdapter|" +
                      "type=|layerStack=' | head -n 160"));

                  raw.append("\n=== SERVICES ===\n");
                  raw.append(runRootCommand(
                      "dumpsys activity services " +
                      "com.google.android.projection.gearhead | " +
                      "grep -i -E 'ServiceRecord|ConnectionRecord|" +
                      "IntentBindRecord|AppBindRecord|BindingRecord|" +
                      "gearhead|WACT|isForeground|startRequested|" +
                      "client=|bound|active' | head -n 180"));

                  raw.append("\n=== RECENT AA LOGS ===\n");
                  raw.append(runRootCommand(
                      "logcat -d -t 3000 | grep -i -E " +
                      "'gearhead|android.auto|carconnection|projection|" +
                      "head.?unit|accessory|wifip2p|wifi.?direct' | " +
                      "tail -n 100"));

                  return raw.toString();
              }

              private void capture(boolean isA) {
                  setBusy(true);
                  output.setText(
                      isA
                          ? "Capturing A (disconnected)...\n"
                          : "Capturing B (connected)...\n");

                  new Thread(() -> {
                      String result = captureRaw();

                      if (isA) {
                          snapshotA = result;
                      } else {
                          snapshotB = result;
                      }

                      runOnUiThread(() -> {
                          output.setText(
                              (isA
                                  ? "SNAPSHOT_A_SAVED\n"
                                  : "SNAPSHOT_B_SAVED\n") +
                              "Snapshot captured.\n\n" + result);
                          setBusy(false);
                      });
                  }).start();
              }

              private void appendDiff(
                  StringBuilder report,
                  String label,
                  String before,
                  String after) {

                  Set<String> a = new LinkedHashSet<>();
                  Set<String> b = new LinkedHashSet<>();

                  for (String line : before.split("\\R")) {
                      if (!line.trim().isEmpty()) {
                          a.add(line);
                      }
                  }

                  for (String line : after.split("\\R")) {
                      if (!line.trim().isEmpty()) {
                          b.add(line);
                      }
                  }

                  report.append("\n--- ").append(label).append(" ---\n");

                  int shown = 0;
                  for (String line : b) {
                      if (!a.contains(line)) {
                          report.append("+ ").append(line).append("\n");
                          if (++shown >= 20) {
                              break;
                          }
                      }
                  }

                  if (shown == 0) {
                      report.append("No added lines detected.\n");
                  }

                  shown = 0;
                  for (String line : a) {
                      if (!b.contains(line)) {
                          report.append("- ").append(line).append("\n");
                          if (++shown >= 20) {
                              break;
                          }
                      }
                  }

                  if (shown == 0) {
                      report.append("No removed lines detected.\n");
                  }

                  report.append(
                      "Text difference only; inspect context before " +
                      "treating a line as connection evidence.\n");
              }

              private void compare() {
                  if (snapshotA == null || snapshotB == null) {
                      output.setText(
                          "INCOMPLETE: Save snapshot A and snapshot B first.\n");
                      return;
                  }

                  StringBuilder report = new StringBuilder();
                  report.append("MIRROR-04D-05D COMPARISON\n");
                  report.append("A = disconnected; B = connected.\n");
                  report.append(
                      "This comparison is diagnostic, not proof by itself.\n");

                  appendDiff(report, "B minus A", snapshotA, snapshotB);
                  appendDiff(report, "A minus B", snapshotB, snapshotA);

                  report.append(
                      "\nRepeat A/B for wireless Android Auto if configured.\n");
                  report.append(
                      "No MediaProjection started; no settings changed.\n");

                  output.setText(report.toString());
              }
          }
          EOF

      - name: Validate generated project
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          ET.parse("mirror0405d/app/src/main/AndroidManifest.xml")
          ET.parse("mirror0405d/app/src/main/res/values/strings.xml")

          path = (
              "mirror0405d/app/src/main/java/"
              "com/carassistant/next/mirror0405d/MainActivity.java"
          )

          with open(path, encoding="utf-8") as f:
              source = f.read()

          required = [
              "captureRaw",
              "dumpsys display",
              "dumpsys activity services",
              "logcat -d -t 3000",
              "SNAPSHOT_A_SAVED",
              "SNAPSHOT_B_SAVED",
              "INCOMPLETE",
          ]

          for marker in required:
              if marker not in source:
                  raise SystemExit("Missing source marker: " + marker)

          print("XML_PARSE_PASS")
          print("SOURCE_MARKERS_PASS")
          PY

      - name: Build debug APK
        working-directory: mirror0405d
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK and generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="mirror0405d/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          mkdir -p output
          cp "$APK" \
            output/MIRROR-04D-05D-connection-signal-verification.apk

          sha256sum \
            output/MIRROR-04D-05D-connection-signal-verification.apk \
            | tee output/SHA256SUMS.txt

          cat > output/BUILD-STATUS.txt <<'EOF'
          Workflow: MIRROR-04D-05D
          Purpose: Compare Android Auto diagnostic signals
          Application ID: com.carassistant.next.mirror0405d
          Protected SHA checks: PASS if this step is reached
          XML validation: PASS if this step is reached
          Gradle build: PASS if this step is reached
          Device test: NOT RUN
          USB test: REQUIRED
          Wireless test: REQUIRED if configured
          Definitive connection detection: NOT YET PROVEN
          MediaProjection auto-recovery: NOT IMPLEMENTED
          EOF

      - name: Upload APK and build status
        uses: actions/upload-artifact@v4
        with:
          name: MIRROR-04D-05D-Connection-Signal-Verification
          path: |
            output/MIRROR-04D-05D-connection-signal-verification.apk
            output/SHA256SUMS.txt
            output/BUILD-STATUS.txt
          if-no-files-found: error
          retention-days: 14
