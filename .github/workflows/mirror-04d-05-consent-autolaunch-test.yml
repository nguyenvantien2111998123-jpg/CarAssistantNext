
name: MIRROR-04D-05 - Consent Auto-Launch Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-04d-05-consent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify protected source and build isolated APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify frozen GD01 and MIRROR-04D-04
        shell: bash
        run: |
          set -euo pipefail

          check_sha() {
            local file="$1"
            local expected="$2"

            if [ ! -f "$file" ]; then
              echo "::error::Missing protected file: $file"
              exit 1
            fi

            local actual
            actual="$(git hash-object "$file")"

            if [ "$actual" != "$expected" ]; then
              echo "::error::Protected SHA mismatch: $file"
              echo "Expected: $expected"
              echo "Actual:   $actual"
              exit 1
            fi

            echo "SHA_PASS $file $actual"
          }

          check_sha \
            app/src/main/java/com/carassistant/next/HookEntry.java \
            667e759417611d6982bb110ef0583f9513db2c63

          check_sha \
            app/src/main/AndroidManifest.xml \
            b23d082324e633bde63f0997e4c90b320f9b69df

          check_sha \
            app/build.gradle \
            7be503b5df091734ea6babd3b0108e220272207b

          check_sha \
            .github/workflows/mirror-04d-04-low-latency.yml \
            c41eb33d7fd459f0ab4e2d7789b1a200305584ef

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create isolated consent test project
        shell: bash
        run: |
          set -euo pipefail

          P=mirror0405
          SRC="$P/app/src/main/java/com/carassistant/next/mirror0405"
          RES="$P/app/src/main/res/xml"

          mkdir -p "$SRC" "$RES"

          cat > "$P/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MIRROR-04D-05"
          include(":app")
          EOF

          cat > "$P/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > "$P/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > "$P/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.carassistant.next.mirror0405'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.carassistant.next.mirror0405'
                  minSdk 29
                  targetSdk 32
                  versionCode 405
                  versionName '04D-05-consent-test'
              }
          }

          dependencies {
              implementation 'androidx.car.app:app:1.7.0'
          }
          EOF

          cat > "$RES/automotive_app_desc.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <automotiveApp>
              <uses name="template" />
          </automotiveApp>
          EOF

          cat > "$P/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="androidx.car.app.ACCESS_SURFACE" />

              <application
                  android:allowBackup="false"
                  android:label="Mirror Consent Test"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <meta-data
                      android:name="com.google.android.gms.car.application"
                      android:resource="@xml/automotive_app_desc" />

                  <meta-data
                      android:name="androidx.car.app.minCarApiLevel"
                      android:value="1" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MirrorCarAppService"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="androidx.car.app.CarAppService" />
                          <category android:name="androidx.car.app.category.NAVIGATION" />
                      </intent-filter>

                      <meta-data
                          android:name="androidx.car.app.minCarApiLevel"
                          android:value="1" />
                  </service>

              </application>
          </manifest>
          EOF

          cat > "$SRC/MainActivity.java" <<'EOF'
          package com.carassistant.next.mirror0405;

          import android.app.Activity;
          import android.content.Intent;
          import android.media.projection.MediaProjectionManager;
          import android.os.Bundle;
          import android.widget.TextView;
          import android.widget.LinearLayout;
          import android.view.Gravity;

          public class MainActivity extends Activity {

              private static final int REQUEST_CAPTURE = 405;
              private TextView status;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(24, 24, 24, 24);

                  status = new TextView(this);
                  status.setTextSize(18);
                  status.setText(
                      "MIRROR-04D-05\n" +
                      "Dang yeu cau xac nhan MediaProjection..."
                  );
                  layout.addView(status);

                  setContentView(layout);

                  MediaProjectionManager manager =
                      (MediaProjectionManager) getSystemService(
                          MEDIA_PROJECTION_SERVICE
                      );

                  if (manager == null) {
                      status.setText("ERROR: MediaProjectionManager unavailable");
                      return;
                  }

                  try {
                      startActivityForResult(
                          manager.createScreenCaptureIntent(),
                          REQUEST_CAPTURE
                      );
                  } catch (Exception e) {
                      status.setText("LAUNCH_ERROR: " + e);
                  }
              }

              @Override
              protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  Intent data
              ) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode != REQUEST_CAPTURE) {
                      return;
                  }

                  if (resultCode == RESULT_OK && data != null) {
                      status.setText(
                          "CONSENT_GRANTED\n" +
                          "Nguoi dung da dong y.\n" +
                          "Ban kiem thu nay chua khoi dong dich vu chieu."
                      );
                  } else {
                      status.setText("CONSENT_DENIED");
                  }
              }
          }
          EOF

          cat > "$SRC/MirrorCarAppService.java" <<'EOF'
          package com.carassistant.next.mirror0405;

          import androidx.car.app.CarAppService;
          import androidx.car.app.Session;
          import androidx.car.app.validation.HostValidator;

          public class MirrorCarAppService extends CarAppService {

              @Override
              public HostValidator createHostValidator() {
                  return HostValidator.ALLOW_ALL_HOSTS_VALIDATOR;
              }

              @Override
              public Session onCreateSession() {
                  return new MirrorSession();
              }
          }
          EOF

          cat > "$SRC/MirrorSession.java" <<'EOF'
          package com.carassistant.next.mirror0405;

          import android.content.Intent;

          import androidx.car.app.Screen;
          import androidx.car.app.Session;

          public class MirrorSession extends Session {

              @Override
              public Screen onCreateScreen(Intent intent) {
              return new MirrorScreen(getCarContext());
              }
          }
          EOF

          cat > "$SRC/MirrorScreen.java" <<'EOF'
          package com.carassistant.next.mirror0405;

          import android.content.Intent;

          import androidx.car.app.CarContext;
          import androidx.car.app.Screen;
          import androidx.car.app.model.Action;
          import androidx.car.app.model.MessageTemplate;
          import androidx.car.app.model.Template;

          public class MirrorScreen extends Screen {

              public MirrorScreen(CarContext context) {
                  super(context);
              }

              @Override
              public Template onGetTemplate() {
                  Action open = new Action.Builder()
                      .setTitle("Open consent test")
                      .setOnClickListener(() -> {
                          Intent intent = new Intent(
                              getCarContext(),
                              MainActivity.class
                          );
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);

                          try {
                              getCarContext().startActivity(intent);
                          } catch (Exception e) {
                              android.util.Log.e(
                                  "MIRROR0405",
                                  "Unable to launch consent Activity",
                                  e
                              );
                          }
                      })
                      .build();

                  return new MessageTemplate.Builder(
                      "Open the consent test on the phone."
                  )
                      .setTitle("MIRROR-04D-05")
                      .addAction(open)
                      .build();
              }
          }
          EOF

      - name: Validate workflow-generated Java sources
        shell: bash
        run: |
          set -euo pipefail

          SRC=mirror0405/app/src/main/java/com/carassistant/next/mirror0405

          test -s "$SRC/MainActivity.java"
          test -s "$SRC/MirrorCarAppService.java"
          test -s "$SRC/MirrorSession.java"
          test -s "$SRC/MirrorScreen.java"

          python3 - <<'PY'
          from pathlib import Path

          root = Path("mirror0405/app/src/main/java/com/carassistant/next/mirror0405")
          for path in sorted(root.glob("*.java")):
              text = path.read_text()
              if text.count("{") != text.count("}"):
                  raise SystemExit(f"Brace mismatch: {path}")
              if "package com.carassistant.next.mirror0405;" not in text:
                  raise SystemExit(f"Wrong package: {path}")
              print(f"SOURCE_CHECK_PASS {path}")
          PY

      - name: Build isolated APK
        working-directory: mirror0405
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK and calculate SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="mirror0405/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          mkdir -p output
          cp "$APK" output/MIRROR-04D-05-consent-test.apk

          sha256sum output/MIRROR-04D-05-consent-test.apk \
            | tee output/SHA256SUMS.txt

          cat > output/BUILD-STATUS.txt <<'EOF'
          Workflow: MIRROR-04D-05 Consent Auto-Launch Test
          Protected source SHA checks: PASS if workflow reached this step
          Java source checks: PASS if workflow reached this step
          APK build: PASS if workflow reached this step
          MediaProjection consent on device: NOT TESTED
          Android Auto background launch: NOT TESTED
          Screen projection service: NOT IMPLEMENTED IN THIS TEST
          EOF

      - name: Upload diagnostic APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: MIRROR-04D-05-Consent-Test
          path: |
            output/MIRROR-04D-05-consent-test.apk
            output/SHA256SUMS.txt
            output/BUILD-STATUS.txt
          if-no-files-found: error
          retention-days: 14
