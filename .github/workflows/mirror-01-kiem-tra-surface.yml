name: MIRROR-01A - Launcher va Car App

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-01-kiem-tra-surface
  cancel-in-progress: false

jobs:
  kiem-tra-surface:
    name: MIRROR-01A - Build va kiem tra dang ky
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Lay source main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Cai JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cai Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Cai Android platform va build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Cai Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Kiem tra bao ve core GD01
        shell: bash
        run: |
          set -euo pipefail

          check_sha() {
            local file="$1"
            local expected="$2"
            local actual

            test -f "$file" || {
              echo "::error::Thieu file core: $file"
              exit 1
            }

            actual="$(git hash-object "$file")"

            echo "$file"
            echo "Expected: $expected"
            echo "Actual:   $actual"

            if [ "$actual" != "$expected" ]; then
              echo "::error::Core GD01 thay doi. Dung workflow."
              exit 1
            fi
          }

          check_sha \
            "app/src/main/java/com/carassistant/next/HookEntry.java" \
            "667e759417611d6982bb110ef0583f9513db2c63"

          check_sha \
            "app/src/main/AndroidManifest.xml" \
            "b23d082324e633bde63f0997e4c90b320f9b69df"

          check_sha \
            "app/build.gradle" \
            "7be503b5df091734ea6babd3b0108e220272207b"

          echo "CORE GD01: PASS"

      - name: Tao project MIRROR-01A rieng
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            mirror01-probe/app/src/main/java/com/carassistant/next/mirror01 \
            mirror01-probe/app/src/main/res/values \
            mirror01-probe/app/src/main/res/xml

          cat > mirror01-probe/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Mirror01Probe"
          include(":app")
          EOF

          cat > mirror01-probe/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > mirror01-probe/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > mirror01-probe/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.carassistant.next.mirror01'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.carassistant.next.mirror01'
                  minSdk 29
                  targetSdk 32
                  versionCode 2
                  versionName '1.0.1-mirror01a'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.car.app:app:1.7.0'
          }
          EOF

          cat > mirror01-probe/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">MIRROR-01A Launcher Test</string>
          </resources>
          EOF

          cat > mirror01-probe/app/src/main/res/xml/automotive_app_desc.xml <<'EOF'
          <automotiveApp xmlns:android="http://schemas.android.com/apk/res/android">
              <uses name="template" />
          </automotiveApp>
          EOF

          cat > mirror01-probe/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="androidx.car.app.ACCESS_SURFACE" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <meta-data
                      android:name="com.google.android.gms.car.application"
                      android:resource="@xml/automotive_app_desc" />

                  <activity
                      android:name=".Mirror01HomeActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".Mirror01CarAppService"
                      android:exported="true">
                      <intent-filter>
                          <action
                              android:name="androidx.car.app.CarAppService" />
                          <category
                              android:name="androidx.car.app.category.NAVIGATION" />
                      </intent-filter>

                      <meta-data
                          android:name="androidx.car.app.minCarApiLevel"
                          android:value="1" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > mirror01-probe/app/src/main/java/com/carassistant/next/mirror01/Mirror01HomeActivity.java <<'EOF'
          package com.carassistant.next.mirror01;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public final class Mirror01HomeActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);

                  int padding = (int) (
                      24 * getResources().getDisplayMetrics().density
                  );
                  root.setPadding(padding, padding, padding, padding);

                  TextView title = new TextView(this);
                  title.setText("MIRROR-01A");
                  title.setTextSize(24);
                  title.setTypeface(null, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);

                  TextView details = new TextView(this);
                  details.setText(
                      "Launcher: OK" + System.lineSeparator() +
                      "Package: com.carassistant.next.mirror01" +
                      System.lineSeparator() + System.lineSeparator() +
                      "Day la APK kiem tra dang ky Car App." +
                      System.lineSeparator() +
                      "Chua truyen hinh anh dien thoai len xe."
                  );
                  details.setTextSize(16);
                  details.setGravity(Gravity.CENTER);

                  root.addView(title);
                  root.addView(details);
                  setContentView(root);
              }
          }
          EOF

          cat > mirror01-probe/app/src/main/java/com/carassistant/next/mirror01/Mirror01CarAppService.java <<'EOF'
          package com.carassistant.next.mirror01;

          import androidx.car.app.CarAppService;
          import androidx.car.app.Session;
          import androidx.car.app.validation.HostValidator;

          public final class Mirror01CarAppService extends CarAppService {
              @Override
              public HostValidator createHostValidator() {
                  return HostValidator.ALLOW_ALL_HOSTS_VALIDATOR;
              }

              @Override
              public Session onCreateSession() {
                  return new Mirror01Session();
              }
          }
          EOF

          cat > mirror01-probe/app/src/main/java/com/carassistant/next/mirror01/Mirror01Session.java <<'EOF'
          package com.carassistant.next.mirror01;

          import android.content.Intent;
          import androidx.car.app.Screen;
          import androidx.car.app.Session;

          public final class Mirror01Session extends Session {
              @Override
              public Screen onCreateScreen(Intent intent) {
                  return new Mirror01Screen(getCarContext());
              }
          }
          EOF

          cat > mirror01-probe/app/src/main/java/com/carassistant/next/mirror01/Mirror01Screen.java <<'EOF'
          package com.carassistant.next.mirror01;

          import androidx.car.app.CarContext;
          import androidx.car.app.Screen;
          import androidx.car.app.model.MessageTemplate;
          import androidx.car.app.model.Action;
          import androidx.car.app.model.Template;

          public final class Mirror01Screen extends Screen {
              public Mirror01Screen(CarContext context) {
                  super(context);
              }

              @Override
              public Template onGetTemplate() {
                  return new MessageTemplate.Builder(
                      "MIRROR-01A: Car App registration test. " +
                      "Surface va truyen hinh chua duoc kiem tra.")
                      .setTitle("MIRROR-01A")
                      .setHeaderAction(Action.APP_ICON)
                      .build();
              }
          }
          EOF

      - name: Build APK MIRROR-01A
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon \
            -p mirror01-probe \
            :app:assembleDebug

          APK="mirror01-probe/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          mkdir -p output
          cp "$APK" output/MIRROR-01A-Launcher-Test.apk

          sha256sum output/MIRROR-01A-Launcher-Test.apk \
            | awk '{print $1 "  MIRROR-01A-Launcher-Test.apk"}' \
            > output/MIRROR-01A-SHA256.txt

      - name: Kiem tra Manifest APK
        shell: bash
        run: |
          set -euo pipefail

          APK="output/MIRROR-01A-Launcher-Test.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee output/MIRROR-01A-Badging.txt

          grep -q "com.carassistant.next.mirror01" \
            output/MIRROR-01A-Badging.txt

          grep -q "launchable-activity" \
            output/MIRROR-01A-Badging.txt

          "$AAPT" dump xmltree "$APK" \
            --file AndroidManifest.xml \
            > output/MIRROR-01A-Manifest.txt

          grep -q "com.google.android.gms.car.application" \
            output/MIRROR-01A-Manifest.txt

          grep -q "android.intent.category.LAUNCHER" \
            output/MIRROR-01A-Manifest.txt

          echo "MIRROR-01A APK manifest checks: PASS"

      - name: Luu APK va ket qua kiem tra
        uses: actions/upload-artifact@v4
        with:
          name: MIRROR-01A-Launcher-Test
          path: |
            output/MIRROR-01A-Launcher-Test.apk
            output/MIRROR-01A-SHA256.txt
            output/MIRROR-01A-Badging.txt
            output/MIRROR-01A-Manifest.txt
          if-no-files-found: error
          retention-days: 14
