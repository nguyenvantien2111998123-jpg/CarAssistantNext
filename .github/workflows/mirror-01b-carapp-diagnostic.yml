name: MIRROR-01B - Car App Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-01b-carapp-diagnostic
  cancel-in-progress: false

jobs:
  build-mirror-01b:
    name: Build và kiểm tra MIRROR-01B
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Cài Android platform và build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Cài Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bảo vệ core GD01
        shell: bash
        run: |
          set -euo pipefail
          check_sha() {
            actual="$(git hash-object "$1")"
            echo "$1: $actual"
            test "$actual" = "$2" || {
              echo "::error::Core GD01 thay đổi: $1"
              exit 1
            }
          }
          check_sha \
            "app/src/main/java/com/carassistant/next/HookEntry.java" \
            "667e759417611d6982bb110ef0583f9513db2c63"
          check_sha \
            "app/src/main/AndroidManifest.xml" \
            "b23d082324e633bde63f0997e4c90b320f9b69df"
          check_sha \
            "app/build.gradle" \
            "7be503b5df091734ea6babd3b0108e220272207b"
          echo "CORE GD01: PASS"

      - name: Tạo project MIRROR-01B riêng
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            mirror01b/app/src/main/java/com/carassistant/next/mirror01b \
            mirror01b/app/src/main/res/values \
            mirror01b/app/src/main/res/xml

          cat > mirror01b/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Mirror01BDiagnostic"
          include(":app")
          EOF

          cat > mirror01b/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > mirror01b/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > mirror01b/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.carassistant.next.mirror01b'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.carassistant.next.mirror01b'
                  minSdk 29
                  targetSdk 32
                  versionCode 1
                  versionName '1.0.1-mirror01b'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.car.app:app:1.7.0'
          }
          EOF

          cat > mirror01b/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">MIRROR-01B Diagnostic</string>
          </resources>
          EOF

          cat > mirror01b/app/src/main/res/xml/automotive_app_desc.xml <<'EOF'
          <automotiveApp xmlns:android="http://schemas.android.com/apk/res/android">
              <uses name="template" />
          </automotiveApp>
          EOF

          cat > mirror01b/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <meta-data
                      android:name="com.google.android.gms.car.application"
                      android:resource="@xml/automotive_app_desc" />
                  <activity
                      android:name=".Mirror01BHomeActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".Mirror01BCarAppService"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="androidx.car.app.CarAppService" />
                          <category android:name="androidx.car.app.category.NAVIGATION" />
                      </intent-filter>
                      <meta-data
                          android:name="androidx.car.app.minCarApiLevel"
                          android:value="1" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > mirror01b/app/src/main/java/com/carassistant/next/mirror01b/Mirror01BHomeActivity.java <<'EOF'
          package com.carassistant.next.mirror01b;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public final class Mirror01BHomeActivity extends Activity {
              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  int p = (int) (24 * getResources().getDisplayMetrics().density);
                  root.setPadding(p, p, p, p);
                  TextView text = new TextView(this);
                  text.setGravity(Gravity.CENTER);
                  text.setTextSize(20);
                  text.setText(
                      "MIRROR-01B\n" +
                      "Launcher: OK\n" +
                      "Package: com.carassistant.next.mirror01b\n\n" +
                      "Car App diagnostic build.\n" +
                      "Chưa hỗ trợ chiếu màn hình."
                  );
                  root.addView(text);
                  setContentView(root);
              }
          }
          EOF

          cat > mirror01b/app/src/main/java/com/carassistant/next/mirror01b/Mirror01BCarAppService.java <<'EOF'
          package com.carassistant.next.mirror01b;

          import android.util.Log;
          import androidx.car.app.CarAppService;
          import androidx.car.app.Session;
          import androidx.car.app.validation.HostValidator;

          public final class Mirror01BCarAppService extends CarAppService {
              private static final String TAG = "MIRROR01B";

              @Override
              public HostValidator createHostValidator() {
                  Log.i(TAG, "createHostValidator");
                  return HostValidator.ALLOW_ALL_HOSTS_VALIDATOR;
              }

              @Override
              public Session onCreateSession() {
                  Log.i(TAG, "onCreateSession");
                  return new Mirror01BSession();
              }
          }
          EOF

          cat > mirror01b/app/src/main/java/com/carassistant/next/mirror01b/Mirror01BSession.java <<'EOF'
          package com.carassistant.next.mirror01b;

          import android.content.Intent;
          import android.util.Log;
          import androidx.car.app.Screen;
          import androidx.car.app.Session;

          public final class Mirror01BSession extends Session {
              private static final String TAG = "MIRROR01B";

              @Override
              public Screen onCreateScreen(Intent intent) {
                  Log.i(TAG, "onCreateScreen");
                  return new Mirror01BScreen(getCarContext());
              }
          }
          EOF

          cat > mirror01b/app/src/main/java/com/carassistant/next/mirror01b/Mirror01BScreen.java <<'EOF'
          package com.carassistant.next.mirror01b;

          import android.util.Log;
          import androidx.car.app.CarContext;
          import androidx.car.app.Screen;
          import androidx.car.app.model.MessageTemplate;
          import androidx.car.app.model.Template;

          public final class Mirror01BScreen extends Screen {
              private static final String TAG = "MIRROR01B";

              public Mirror01BScreen(CarContext context) {
                  super(context);
                  Log.i(TAG, "Screen constructor");
              }

              @Override
              public Template onGetTemplate() {
                  Log.i(TAG, "onGetTemplate: building MessageTemplate");
                  return new MessageTemplate.Builder("MIRROR-01B diagnostic: template rendered.")
                      .setTitle("MIRROR-01B")
                      .build();
              }
          }
          EOF

      - name: Build APK MIRROR-01B
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p mirror01b :app:assembleDebug
          APK="mirror01b/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p output
          cp "$APK" output/MIRROR-01B-Diagnostic.apk
          sha256sum output/MIRROR-01B-Diagnostic.apk > output/MIRROR-01B-SHA256.txt

      - name: Kiểm tra APK và Manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="output/MIRROR-01B-Diagnostic.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          
          "$AAPT" dump badging "$APK" | tee output/MIRROR-01B-Badging.txt
          grep -q "com.carassistant.next.mirror01b" output/MIRROR-01B-Badging.txt
          
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > output/MIRROR-01B-Manifest.txt
          grep -q "com.google.android.gms.car.application" output/MIRROR-01B-Manifest.txt
          grep -q "androidx.car.app.CarAppService" output/MIRROR-01B-Manifest.txt
          
          echo "MIRROR-01B APK checks: PASS"

      - name: Lưu artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIRROR-01B-Diagnostic
          path: |
            output/MIRROR-01B-Diagnostic.apk
            output/MIRROR-01B-SHA256.txt
            output/MIRROR-01B-Badging.txt
            output/MIRROR-01B-Manifest.txt
          if-no-files-found: error
          retention-days: 14
