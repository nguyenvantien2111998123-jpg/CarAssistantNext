name: CarAssistantNext - System Bridge Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/system-bridge-probe.yml"

permissions:
  contents: read

concurrency:
  group: system-bridge-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-system-bridge-probe:
    name: Build isolated LSPosed probe
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main source
        uses: actions/checkout@v4

      - name: Verify protected Core and P2A files
        shell: bash
        run: |
          set -euo pipefail

          check_blob() {
            expected="$1"
            path="$2"

            if [ ! -f "$path" ]; then
              echo "::error::Missing protected file: $path"
              exit 1
            fi

            actual="$(git hash-object "$path")"

            if [ "$actual" != "$expected" ]; then
              echo "::error::Protected file SHA mismatch: $path"
              echo "Expected: $expected"
              echo "Actual:   $actual"
              exit 1
            fi

            echo "PASS protected: $path"
          }

          check_blob d8ddc5abcd112b233e59cd7898efab51045bea50 \
            app/src/main/java/com/carassistant/next/LauncherShellView.java

          check_blob ca8120b7ad136026caff184a7471914dafbfa708 \
            app/src/main/java/com/carassistant/next/HomeActivity.java

          check_blob c69ffa3e152452b00b2b23dc94922accbd54a3cd \
            app/src/main/java/com/carassistant/next/P2ASurfaceProbeService.java

          check_blob 357f775c8959bfe40010d9b5e2c06a0cb805c32c \
            app/src/main/java/com/carassistant/next/P2ASurfaceProbeSession.java

          check_blob b9bc0ece6b71553a04cb19858ebb642cb13fe59a \
            app/src/main/java/com/carassistant/next/P2ASurfaceProbeScreen.java

          check_blob 30260c84184e972c77b9a2ba583ab0f72d44d197 \
            app/src/main/AndroidManifest.xml

          check_blob c1701bc98aba06cc64292d560f0aaa10e64b622b \
            app/build.gradle

          check_blob 0e224a8ce0f6f9300d357bb9ad305f82b4cd7dde \
            .github/workflows/build-carassistant-next-core.yml

          check_blob 327630789d8ca2737c72b3818f4709ea9e562f67 \
            .github/workflows/patch-p2a-android-auto-surface-probe.yml

          echo "PASS: protected files match the recorded baseline."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate isolated probe project
        shell: bash
        run: |
          set -euo pipefail

          P="$RUNNER_TEMP/system-bridge-probe"

          mkdir -p \
            "$P/app/src/main/assets" \
            "$P/app/src/main/java/com/carassistant/next/systembridgeprobe"

          cat > "$P/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://api.xposed.info/") }
              }
          }

          rootProject.name = "CarAssistantNextSystemBridgeProbe"
          include(":app")
          EOF

          cat > "$P/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.0' apply false
          }
          EOF

          cat > "$P/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > "$P/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.carassistant.next.systembridgeprobe'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.carassistant.next.systembridgeprobe'
                  minSdk 26
                  targetSdk 32
                  versionCode 1
                  versionName '0.1-probe'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              compileOnly 'de.robv.android.xposed:api:82'
          }
          EOF

          cat > "$P/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="System Bridge Probe"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <meta-data
                      android:name="xposedmodule"
                      android:value="true" />
                  <meta-data
                      android:name="xposeddescription"
                      android:value="Diagnostic-only probe. Logs targeted process loading; installs no hooks." />
                  <meta-data
                      android:name="xposedminversion"
                      android:value="82" />

                  <activity
                      android:name=".ProbeActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$P/app/src/main/assets/xposed_init" <<'EOF'
          com.carassistant.next.systembridgeprobe.SystemBridgeProbe
          EOF

          cat > "$P/app/src/main/java/com/carassistant/next/systembridgeprobe/SystemBridgeProbe.java" <<'EOF'
          package com.carassistant.next.systembridgeprobe;

          import android.os.Build;
          import android.os.Process;

          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          public final class SystemBridgeProbe
                  implements IXposedHookLoadPackage {

              private static final String TAG =
                      "[CarAssistantNext-SystemBridgeProbe]";

              @Override
              public void handleLoadPackage(
                      XC_LoadPackage.LoadPackageParam p) {

                  String pkg = p.packageName;

                  if (!"android".equals(pkg)
                          && !"com.google.android.projection.gearhead".equals(pkg)) {
                      return;
                  }

                  String event = "android".equals(pkg)
                          ? "SYSTEM_SERVER_LOAD"
                          : "ANDROID_AUTO_LOAD";

                  int uid = p.appInfo != null ? p.appInfo.uid : -1;

                  XposedBridge.log(TAG
                          + " event=" + event
                          + " package=" + pkg
                          + " process=" + p.processName
                          + " uid=" + uid
                          + " pid=" + Process.myPid()
                          + " sdk=" + Build.VERSION.SDK_INT
                          + " fingerprint=" + Build.FINGERPRINT);
              }
          }
          EOF

          cat > "$P/app/src/main/java/com/carassistant/next/systembridgeprobe/ProbeActivity.java" <<'EOF'
          package com.carassistant.next.systembridgeprobe;

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;

          public final class ProbeActivity extends Activity {
              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  TextView view = new TextView(this);
                  view.setText(
                      "CarAssistantNext System Bridge Probe\n\n"
                      + "Diagnostic-only module.\n\n"
                      + "This screen does not prove LSPosed loaded the module. "
                      + "Enable the module, set its scope, reboot, and inspect "
                      + "LSPosed logs for SYSTEM_SERVER_LOAD and ANDROID_AUTO_LOAD.\n\n"
                      + "No methods are hooked. No display or input behavior is changed."
                  );
                  view.setTextSize(18f);

                  int pad = (int) (24 * getResources()
                      .getDisplayMetrics().density);
                  view.setPadding(pad, pad, pad, pad);
                  setContentView(view);
              }
          }
          EOF

          echo "PASS: standalone probe source generated outside the repository."

      - name: Build probe APK
        shell: bash
        run: |
          set -euo pipefail

          P="$RUNNER_TEMP/system-bridge-probe"

          gradle -p "$P" --no-daemon :app:assembleDebug

          APK="$P/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          mkdir -p artifacts
          cp "$APK" artifacts/CarAssistantNext-SystemBridgeProbe-debug.apk

          unzip -l artifacts/CarAssistantNext-SystemBridgeProbe-debug.apk \
            | grep -F "assets/xposed_init"

          sha256sum artifacts/CarAssistantNext-SystemBridgeProbe-debug.apk \
            | tee artifacts/SHA256SUMS.txt

      - name: Upload probe APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistantNext-SystemBridgeProbe
          path: |
            artifacts/CarAssistantNext-SystemBridgeProbe-debug.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
