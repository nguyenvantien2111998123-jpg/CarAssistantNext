name: MIRROR-04C - AutoStart Lifecycle Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-04c-autostart-lifecycle
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify MIRROR-04C
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify frozen GD01 core
        shell: bash
        run: |
          set -euo pipefail
          check_sha() {
            local file="$1"
            local expected="$2"
            local actual
            test -f "$file"
            actual="$(git hash-object "$file")"
            echo "$file: $actual"
            test "$actual" = "$expected" || {
              echo "::error::GD01 SHA mismatch: $file"
              exit 1
            }
          }
          check_sha "app/src/main/java/com/carassistant/next/HookEntry.java" "667e759417611d6982bb110ef0583f9513db2c63"
          check_sha "app/src/main/AndroidManifest.xml" "b23d082324e633bde63f0997e4c90b320f9b69df"
          check_sha "app/build.gradle" "7be503b5df091734ea6babd3b0108e220272207b"
          echo "GD01 CORE SHA CHECK: PASS"

      - name: Create isolated Android project
        shell: bash
        run: |
          set -euo pipefail
          B=mirror04c
          J="$B/app/src/main/java/com/carassistant/next/mirror04c"
          mkdir -p "$J" "$B/app/src/main/res/values"
          
          cat > "$B/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Mirror04CAutoStartLifecycle"
          include(":app")
          EOF
          
          cat > "$B/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          
          cat > "$B/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          
          cat > "$B/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.carassistant.next.mirror04c'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.carassistant.next.mirror04c'
                  minSdk 29
                  targetSdk 32
                  versionCode 1
                  versionName '1.0.0-mirror04c'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          
          cat > "$B/app/src/main/res/values/strings.xml" <<'EOF'
          <resources>
              <string name="app_name">MIRROR-04C AutoStart Test</string>
          </resources>
          EOF
          
          cat > "$B/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <application android:allowBackup="false" android:label="@string/app_name" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".AutoStartActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".LifecycleService" android:exported="false" />
                  <receiver android:name=".ConnectionReceiver" android:enabled="true" android:exported="true">
                      <intent-filter>
                          <action android:name="android.bluetooth.device.action.ACL_CONNECTED" />
                          <action android:name="android.bluetooth.device.action.ACL_DISCONNECTED" />
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF
          
          cat > "$J/AutoStartActivity.java" <<'EOF'
          package com.carassistant.next.mirror04c;
          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          public final class AutoStartActivity extends Activity {
              private static final String PREF = "mirror04c_state";
              private TextView status;
              static SharedPreferences prefs(android.content.Context c) {
                  return c.getSharedPreferences(PREF, MODE_PRIVATE);
              }
              static boolean enabled(android.content.Context c) {
                  return prefs(c).getBoolean("auto_start", false);
              }
              static void event(android.content.Context c, String value) {
                  prefs(c).edit()
                      .putString("last_event", value)
                      .putLong("last_time", System.currentTimeMillis())
                      .apply();
              }
              static String lastEvent(android.content.Context c) {
                  return prefs(c).getString("last_event", "No event recorded") + "\nTimestamp: " + prefs(c).getLong("last_time", 0L);
              }
              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);
                  if (Build.VERSION.SDK_INT >= 31 && checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                          new String[]{Manifest.permission.BLUETOOTH_CONNECT}, 404);
                  }
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24, 24, 24, 24);
                  TextView title = new TextView(this);
                  title.setText("MIRROR-04C\nAutoStart + Lifecycle Probe");
                  title.setTextSize(22);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);
                  status = new TextView(this);
                  status.setTextSize(16);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, 0, 1);
                  lp.topMargin = 20;
                  root.addView(status, lp);
                  Button enable = new Button(this);
                  enable.setText("ENABLE Bluetooth auto-start");
                  enable.setOnClickListener(v -> {
                      prefs(this).edit().putBoolean("auto_start", true).apply();
                      event(this, "AUTO_START_ENABLED");
                      refresh();
                  });
                  root.addView(enable);
                  Button disable = new Button(this);
                  disable.setText("DISABLE auto-start");
                  disable.setOnClickListener(v -> {
                      prefs(this).edit().putBoolean("auto_start", false).apply();
                      event(this, "AUTO_START_DISABLED");
                      stopService(new Intent(this, LifecycleService.class));
                      refresh();
                  });
                  root.addView(disable);
                  Button start = new Button(this);
                  start.setText("START lifecycle service manually");
                  start.setOnClickListener(v -> LifecycleService.start(this, "MANUAL_START"));
                  root.addView(start);
                  Button stop = new Button(this);
                  stop.setText("STOP lifecycle service");
                  stop.setOnClickListener(v -> stopService(new Intent(this, LifecycleService.class)));
                  root.addView(stop);
                  setContentView(root);
                  refresh();
              }
              @Override
              protected void onResume() {
                  super.onResume();
                  refresh();
              }
              private void refresh() {
                  if (status == null) return;
                  status.setText("Auto-start enabled: " + enabled(this) + "\nLast event:\n" + lastEvent(this) + "\n\nProbe only: this APK does not capture or mirror the phone screen.");
              }
          }
          EOF
          
          cat > "$J/ConnectionReceiver.java" <<'EOF'
          package com.carassistant.next.mirror04c;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.bluetooth.BluetoothDevice;
          import android.util.Log;
          public final class ConnectionReceiver extends BroadcastReceiver {
              private static final String TAG = "MIRROR04C";
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (intent == null || intent.getAction() == null) return;
                  String action = intent.getAction();
                  Log.i(TAG, "CONNECTION_EVENT=" + action);
                  if (Intent.ACTION_BOOT_COMPLETED.equals(action)) {
                      AutoStartActivity.event(context, "BOOT_COMPLETED");
                      return;
                  }
                  if (BluetoothDevice.ACTION_ACL_CONNECTED.equals(action)) {
                      AutoStartActivity.event(context, "BLUETOOTH_ACL_CONNECTED");
                      if (AutoStartActivity.enabled(context)) {
                          LifecycleService.start(context, "BLUETOOTH_ACL_CONNECTED");
                      }
                  } else if (BluetoothDevice.ACTION_ACL_DISCONNECTED.equals(action)) {
                      AutoStartActivity.event(context, "BLUETOOTH_ACL_DISCONNECTED");
                  }
              }
          }
          EOF
          
          cat > "$J/LifecycleService.java" <<'EOF'
          package com.carassistant.next.mirror04c;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import android.util.Log;
          public final class LifecycleService extends Service {
              private static final String TAG = "MIRROR04C";
              private static final String CHANNEL = "mirror04c_lifecycle";
              static void start(Context context, String reason) {
                  Intent i = new Intent(context, LifecycleService.class);
                  i.setAction(reason);
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          context.startForegroundService(i);
                      } else {
                          context.startService(i);
                      }
                  } catch (Throwable error) {
                      AutoStartActivity.event(context, "SERVICE_START_FAILED: " + error.getClass().getSimpleName());
                      Log.e(TAG, "SERVICE_START_FAILED", error);
                  }
              }
              @Override
              public void onCreate() {
                  super.onCreate();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel(
                          CHANNEL, "MIRROR-04C lifecycle", NotificationManager.IMPORTANCE_LOW);
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(ch);
                  }
                  Intent open = new Intent(this, AutoStartActivity.class);
                  int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= 23) flags |= PendingIntent.FLAG_IMMUTABLE;
                  PendingIntent pi = PendingIntent.getActivity(this, 404, open, flags);
                  Notification.Builder builder = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O ? new Notification.Builder(this, CHANNEL) : new Notification.Builder(this);
                  Notification notification = builder
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .setContentTitle("MIRROR-04C")
                      .setContentText("Auto-start/lifecycle service is running")
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build();
                  startForeground(404, notification);
                  AutoStartActivity.event(this, "FOREGROUND_SERVICE_CREATED");
                  Log.i(TAG, "FOREGROUND_SERVICE_CREATED");
              }
              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  String reason = intent == null ? "NULL_INTENT" : intent.getAction();
                  AutoStartActivity.event(this, "SERVICE_START: " + reason);
                  Log.i(TAG, "SERVICE_START: " + reason);
                  return START_STICKY;
              }
              @Override
              public void onDestroy() {
                  AutoStartActivity.event(this, "FOREGROUND_SERVICE_DESTROYED");
                  Log.i(TAG, "FOREGROUND_SERVICE_DESTROYED");
                  stopForeground(true);
                  super.onDestroy();
              }
              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd mirror04c
          gradle --no-daemon --stacktrace assembleDebug
          cd ..
          mkdir -p dist
          cp mirror04c/app/build/outputs/apk/debug/app-debug.apk dist/MIRROR-04C-AutoStart-Lifecycle-Probe.apk
          sha256sum dist/MIRROR-04C-AutoStart-Lifecycle-Probe.apk | tee dist/SHA256SUMS.txt

      - name: Verify package and frozen core
        shell: bash
        run: |
          set -euo pipefail
          APK=dist/MIRROR-04C-AutoStart-Lifecycle-Probe.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.carassistant.next.mirror04c'"
          echo "MIRROR-04C PACKAGE CHECK: PASS"
          test "$(git hash-object app/src/main/java/com/carassistant/next/HookEntry.java)" = "667e759417611d6982bb110ef0583f9513db2c63"
          test "$(git hash-object app/src/main/AndroidManifest.xml)" = "b23d082324e633bde63f0997e4c90b320f9b69df"
          test "$(git hash-object app/build.gradle)" = "7be503b5df091734ea6babd3b0108e220272207b"
          echo "GD01 CORE RECHECK: PASS"

      - name: Upload MIRROR-04C artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIRROR-04C-AutoStart-Lifecycle-Probe
          path: |
            dist/MIRROR-04C-AutoStart-Lifecycle-Probe.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
